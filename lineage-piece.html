:root{color-scheme:light dark}
img{max-width:100%}

<title>Lineage Piece Field Manual</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root{
  --ground:#e7ecec; --surface:#f9fbfa; --sunk:#dfe5e5; --raise:#ffffff; --stripe:#f2f5f4;
  --ink:#0b191c; --ink2:#33474b; --muted:#687f84; --line:#c4cfcf; --line2:#d9e0e0;
  --gold:#9c650a; --gold-soft:#f2e6c8; --teal:#0c6b74; --teal-soft:#dceaeb;
  --violet:#66399c; --good:#1c7346; --warn:#8d5c0c; --bad:#9d2f28;
  --r-common:#68797d; --r-uncommon:#2f7a4b; --r-rare:#1f66a8; --r-epic:#6b3aa0;
  --r-legendary:#9c650a; --r-mythical:#a8206b; --r-exclusive:#a83c14;
  --sans:"Chivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Big Shoulders Display","Big Shoulders","Oswald","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#081215; --surface:#0e1c20; --sunk:#0b171a; --raise:#132328; --stripe:#101f23;
  --ink:#e9f1f0; --ink2:#b6c7c8; --muted:#7f979c; --line:#23383e; --line2:#1a2c31;
  --gold:#e2ac41; --gold-soft:#332809; --teal:#54c6cc; --teal-soft:#0c2c30;
  --violet:#c197ff; --good:#4fcd91; --warn:#e9b352; --bad:#ff7d6d;
  --r-common:#8ba1a6; --r-uncommon:#5cc98a; --r-rare:#5aa9ee; --r-epic:#bb92ff;
  --r-legendary:#e2ac41; --r-mythical:#ff5fae; --r-exclusive:#ff8a52;
}}
:root[data-theme="dark"]{
  --ground:#081215; --surface:#0e1c20; --sunk:#0b171a; --raise:#132328; --stripe:#101f23;
  --ink:#e9f1f0; --ink2:#b6c7c8; --muted:#7f979c; --line:#23383e; --line2:#1a2c31;
  --gold:#e2ac41; --gold-soft:#332809; --teal:#54c6cc; --teal-soft:#0c2c30;
  --violet:#c197ff; --good:#4fcd91; --warn:#e9b352; --bad:#ff7d6d;
  --r-common:#8ba1a6; --r-uncommon:#5cc98a; --r-rare:#5aa9ee; --r-epic:#bb92ff;
  --r-legendary:#e2ac41; --r-mythical:#ff5fae; --r-exclusive:#ff8a52;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
table{border-collapse:collapse;width:100%}

/* ── top bar ─────────────────────── */
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:9px clamp(12px,2vw,22px)}
.mark{display:flex;flex-direction:column;gap:0;flex:0 0 auto}
.mark b{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1;color:var(--ink)}
.mark span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mark:hover{text-decoration:none}
.searchwrap{position:relative;flex:1 1 300px;max-width:520px}
#search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:8px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
#search::placeholder{color:var(--muted)}
.results{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);max-height:56vh;overflow-y:auto;z-index:80}
.results button{display:flex;width:100%;gap:9px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:8px 11px;font-size:13px}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.sel{background:var(--sunk)}
.results .rn{flex:1;color:var(--ink)}
.results .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.results .none{padding:12px;color:var(--muted);font-size:13px}
.topright{display:flex;gap:8px;align-items:center;margin-left:auto;flex:0 0 auto}
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);border-radius:5px;padding:5px 9px;font-size:12px;color:var(--ink2);white-space:nowrap}
.ghost:hover{border-color:var(--ink2);color:var(--ink)}

/* ── frame ───────────────────────── */
.frame{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1500px;margin:0 auto}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 0 50px;position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto}
.sgroup{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:14px 18px 5px}
.side a{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:5px 18px;color:var(--ink2);font-size:13px;border-left:2px solid transparent}
.side a:hover{background:var(--sunk);color:var(--ink);text-decoration:none}
.side a.on{background:var(--sunk);color:var(--ink);border-left-color:var(--gold);font-weight:500}
.side a em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--muted)}
.view{padding:20px clamp(14px,2.6vw,40px) 90px;min-width:0}

/* ── article + infobox ───────────── */
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.page.full{grid-template-columns:minmax(0,1fr)}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;gap:7px;flex-wrap:wrap}
.crumb a{color:var(--muted)}
h1.pt{font-size:clamp(30px,4.2vw,44px);letter-spacing:-.015em;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.t{border-color:currentColor;font-weight:600}
.lead{margin-top:16px;font-size:15.5px;color:var(--ink2);max-width:66ch}
.lead strong{color:var(--ink)}
h2.sh{font-size:21px;margin:26px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.prose{color:var(--ink2);max-width:70ch}
.prose p+p{margin-top:9px}
.prose ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.prose li::marker{color:var(--gold)}
.prose strong{color:var(--ink)}
.prose ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}

.infobox{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:sticky;top:62px}
.ibhead{background:var(--gold-soft);border-bottom:1px solid var(--line);padding:9px 13px}
.ibhead b{font-family:var(--disp);font-size:17px;font-weight:800;display:block;line-height:1.1;color:var(--ink)}
.ibhead span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ibrow{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:7px 13px;border-bottom:1px solid var(--line2);font-size:12.5px}
.ibrow:last-child{border-bottom:0}
.ibrow dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.ibrow dd{margin:0;color:var(--ink2)}
.ibrow dd b{color:var(--ink)}
.seealso{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seealso a{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--ink2);background:var(--surface)}
.seealso a:hover{border-color:var(--gold);color:var(--gold);text-decoration:none}
.pagefoot{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ── index tables ────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:14px}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:400;background:var(--surface);position:relative;user-select:none}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--ink)}
thead th.asc::after{content:" \2191";color:var(--gold)}
thead th.desc::after{content:" \2193";color:var(--gold)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2);font-size:13px}
tbody tr:nth-child(even) td{background:var(--stripe)}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
tbody a{color:var(--ink);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.rar{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tier{font-family:var(--disp);font-weight:800;font-size:14px;width:23px;height:23px;display:inline-grid;place-items:center;border-radius:4px;color:#fff}
.t-S{background:var(--r-mythical)} .t-A{background:var(--r-legendary)} .t-B{background:var(--teal)} .t-C{background:var(--r-common)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.flag{border-bottom:1px dotted var(--warn);color:var(--warn);cursor:help}

/* ── home ────────────────────────── */
.hero{border-bottom:2px solid var(--ink);padding-bottom:20px}
.hero h1{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin-top:11px;max-width:64ch;color:var(--ink2);font-size:15.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.tile:hover{border-color:var(--gold);text-decoration:none}
.tile b{font-family:var(--disp);font-size:18px;font-weight:800;color:var(--ink)}
.tile span{font-size:12.5px;color:var(--ink2)}
.tile em{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--gold)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px;margin-top:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.cat:hover{background:var(--sunk);border-color:var(--gold);text-decoration:none}
.cat b{font-family:var(--disp);font-size:17px;font-weight:700;color:var(--ink)}
.cat span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.warnbox{border-left:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:11px 14px;border-radius:0 4px 4px 0;font-size:13px;color:var(--ink2);margin-top:16px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:11px;margin-top:12px}

/* ── guides + tools ──────────────── */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.phasehead{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--sunk)}
.phasehead h3{font-size:17px;flex:1}
.phasehead .lv{font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.tasks{list-style:none;margin:0;padding:5px 7px}
.task{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--ink2)}
.task:hover{background:var(--sunk)}
.task input{margin:4px 0 0;accent-color:var(--gold);width:14px;height:14px;flex:0 0 auto}
.task.done{color:var(--muted);text-decoration:line-through}
.progline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;margin-top:14px}
.progtrack{flex:1 1 180px;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.progfill{height:100%;background:var(--gold);width:0;transition:width .25s}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:14px;margin-top:14px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
select,input[type=number]{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ro{background:var(--raise);padding:10px 12px}
.ro b{display:block;font-family:var(--disp);font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.ro small{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.chartbox{border:1px solid var(--line2);border-radius:5px;background:var(--raise);padding:11px 7px 3px}
.stackrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;background:var(--raise);border:1px solid var(--line2);border-radius:4px}
.stackrow .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.stackrow.total{background:var(--gold-soft);border-color:var(--gold)}
.stackrow.total span{color:var(--ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:6px}
.codegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:10px;margin-top:14px}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
.code .c{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink);word-break:break-all}
.code small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:400}
.copy{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.copy:hover{border-color:var(--gold);color:var(--gold)}
.copy.ok{border-color:var(--good);color:var(--good)}
.srclist{columns:2 230px;column-gap:24px;font-size:12.5px;color:var(--ink2);padding-left:18px}
.srclist li{margin-bottom:4px;break-inside:avoid}

@media (max-width:1080px){.page{grid-template-columns:minmax(0,1fr)}.infobox{position:static;order:-1}}
@media (max-width:860px){
  .frame{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 0}
  .side a{display:inline-flex;border:1px solid var(--line);border-radius:99px;margin:2px;padding:4px 11px;border-left-width:1px}
  .side a.on{border-color:var(--gold)}
  .side a em{display:none}
  .sgroup{padding:9px 14px 3px}
  .top{flex-wrap:wrap}.stamp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="#/"><b>Lineage Piece</b><span>Field Manual</span></a>
  <div class="searchwrap">
    <input id="search" type="search" autocomplete="off" placeholder="Search 140 pages &mdash; fruits, races, bosses, keys, NPCs&hellip;  (press /)" aria-label="Search the wiki">
    <div id="results" class="results" hidden></div>
  </div>
  <div class="topright">
    <span class="stamp">Data: Frieren patch</span>
    <button class="ghost" id="randbtn" type="button">Random page</button>
    <button class="ghost" id="themebtn" type="button">Theme</button>
  </div>
</header>

<div class="frame">
  <nav class="side" id="side" aria-label="Categories"></nav>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<script>
"use strict";
/* ════════ Lineage Piece Field Manual — a client-side wiki ════════
   Data compiled Sept 2026 (Frieren patch) from community wikis.
   No official public database exists; disputed figures carry .flag marks.  */

const DB = [];
const E = (type, id, name, o) => { DB.push(Object.assign({type, id, name}, o)); };

const CATS = {
  island:   {n:"Islands",         g:"The world",  cols:["Island","Level band","Role"]},
  boss:     {n:"Bosses",          g:"The world",  cols:["Boss","Location","Access","Why you go"]},
  npc:      {n:"NPCs",            g:"The world",  cols:["NPC","Island","What they do"]},
  fruit:    {n:"Devil fruits",    g:"Power",      cols:["Fruit","Tier","Roll chance","Notes"]},
  race:     {n:"Races",           g:"Power",      cols:["Race","Rarity","Buffs","Best for"]},
  trait:    {n:"Traits",          g:"Power",      cols:["Trait","Tier","Standing"]},
  weapon:   {n:"Weapons",         g:"Power",      cols:["Weapon","Tier","Crafted at","Headline cost"]},
  style:    {n:"Fighting styles", g:"Power",      cols:["Style","Source","Mastery gate"]},
  haki:     {n:"Haki",            g:"Power",      cols:["Haki","Effect","Requirement"]},
  accessory:{n:"Accessories",     g:"Power",      cols:["Accessory","Drop rate","Best for"]},
  artifact: {n:"Artifact sets",   g:"Power",      cols:["Set","2-piece","4-piece","Channel"]},
  item:     {n:"Items &amp; keys",g:"Database",   cols:["Item","Kind","Source","Used for"]},
  mechanic: {n:"Systems",         g:"Database",   cols:["System","In one line"]}

/* ─────────────────────────── ISLANDS ─────────────────────────── */

/* ── category index ── */
let sortState = {};
function category(type) {
  const cat = CATS[type], rows = DB.filter(e => e.type === type);
  const facets = {}; rows.forEach(e => { const k = e.tier || e.rar; if (k) facets[k] = 1; });
  const keys = Object.keys(facets);
  const st = sortState[type] || {i: -1, dir: 1};
  view.innerHTML = '<div class="page full"><div class="crumb"><a href="#/">Main page</a> &rsaquo; <span>' + cat.n + "</span></div>"
    + '<h1 class="pt">' + cat.n + '</h1><div class="chips"><span class="chip">' + rows.length + " pages</span>"
    + '<span class="chip">Click a column to sort</span></div>'
    + (keys.length ? '<div class="filters"><button class="fbtn on" data-f="">All</button>' + keys.map(k => '<button class="fbtn" data-f="' + k + '">' + k + "</button>").join("") + "</div>" : "")
    + '<div class="tablewrap"><table><thead><tr>' + cat.cols.map((c, i) => '<th class="s' + (st.i === i ? (st.dir > 0 ? " asc" : " desc") : "") + '" data-i="' + i + '">' + c + "</th>").join("") + '</tr></thead><tbody id="rows"></tbody></table></div>'
    + '<p class="note">Every row links to its own page. Search from the bar above to jump straight to one.</p></div>';

  let filter = "";
  function draw() {
    let list = rows.filter(e => !filter || e.tier === filter || e.rar === filter);
    if (st.i >= 0) {
      list = list.slice().sort((a, b) => {
        const av = st.i === 0 ? a.name : a.t[st.i - 1], bv = st.i === 0 ? b.name : b.t[st.i - 1];
        const an = parseFloat(strip(av)), bn = parseFloat(strip(bv));
        const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : strip(av).localeCompare(strip(bv));
        return cmp * st.dir;
      });
    }
    $("#rows").innerHTML = list.map(e => "<tr><td><a href='#/e/" + e.id + "'>" + e.name + "</a></td>"
      + e.t.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("")
      || '<tr><td colspan="' + cat.cols.length + '" style="padding:20px;text-align:center;color:var(--muted)">Nothing matches that filter.</td></tr>';
  }
  draw();
  view.querySelectorAll("th.s").forEach(th => th.addEventListener("click", () => {
    const i = +th.dataset.i;
    st.dir = (st.i === i) ? -st.dir : 1; st.i = i; sortState[type] = st;
    view.querySelectorAll("th.s").forEach(x => x.classList.remove("asc", "desc"));
    th.classList.add(st.dir > 0 ? "asc" : "desc");
    draw();
  }));
  view.querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => {
    view.querySelectorAll(".fbtn").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; draw();
  }));
}

    + (i > 0 && i < sibs.length - 1 ? " &nbsp;&middot;&nbsp; " : "")

  return '<div class="crumb"><a href="#/">Main page</a> &rsaquo; <span>' + name + "</span></div>"
    + '<h1 class="pt">' + name + '</h1><p class="lead">' + lede + "</p>";
}

const GUIDEVIEW = {
 "progression": function () {
   const total = PHASES.reduce((n, p) => n + p.tasks.length, 0);
   view.innerHTML = '<div class="page full">' + head("Progression roadmap",
     "Six phases from the starter village to the endgame loops, each ending in the thing that unlocks the next. Tick items off &mdash; progress is stored on this device.")
     + '<div class="progline"><div class="progtrack"><div class="progfill" id="pf"></div></div><span class="num" id="pt" style="color:var(--muted);font-size:12.5px"></span><button class="ghost" id="reset" type="button">Clear progress</button></div>'
     + PHASES.map((p, pi) => '<div class="phase"><div class="phasehead"><h3>' + p.t + '</h3><span class="lv">' + p.lv + '</span></div><ul class="tasks">'
       + p.tasks.map((t, ti) => '<li class="task' + (done[pi + ":" + ti] ? " done" : "") + '" data-k="' + pi + ":" + ti + '"><input type="checkbox"'
         + (done[pi + ":" + ti] ? " checked" : "") + ' aria-label="' + strip(t) + '"><span>' + t + "</span></li>").join("")
       + "</ul></div>").join("") + "</div>";
   const paint = () => {
     const n = Object.keys(done).filter(k => done[k]).length;
     $("#pf").style.width = Math.round(n / total * 100) + "%";
     $("#pt").textContent = n + " / " + total + " steps";
   };
   view.querySelectorAll(".task").forEach(li => li.addEventListener("click", ev => {
     const cb = $("input", li);
     if (ev.target !== cb) cb.checked = !cb.checked;
     if (cb.checked) done[li.dataset.k] = 1; else delete done[li.dataset.k];
     li.classList.toggle("done", cb.checked); saveProg(); paint();
   }));
   $("#reset").addEventListener("click", () => {
     done = {}; saveProg();
     view.querySelectorAll(".task").forEach(li => { li.classList.remove("done"); $("input", li).checked = false; });
     paint();
   });
   paint();
 },
 "first-hour": function () {
   view.innerHTML = '<div class="page full">' + head("The first hour",
     "Lineage Piece hands you nothing and expects you to route yourself. These six decisions skip the mistakes that cost new accounts the most time.")
     + '<div class="tiles">' + FIRST.map((f, i) => '<div class="tile" style="cursor:default"><em>' + (i + 1) + " &middot; " + f[1] + '</em><b>' + f[0] + "</b><span>" + f[2] + "</span></div>").join("")
     + '</div><p class="note">Next: the <a href="#/g/progression">progression roadmap</a> takes it from here to the endgame.</p></div>';
 },
 "tiers": function () {
   const tiers = ["S", "A", "B", "C"], names = {S: "Top of the meta", A: "Strong, and realistic", B: "Serviceable", C: "Replace when you can"};
   let h = '<div class="page full">' + head("Tier lists",
     "Generated from every ranked page in the database. Rankings are the one thing community sources broadly agree on &mdash; the percentages behind them are not.");
   tiers.forEach(t => {
     const rows = DB.filter(e => e.tier === t);
     if (!rows.length) return;
     h += '<h2 class="sh"><span class="tier t-' + t + '">' + t + "</span> &nbsp;" + names[t] + "</h2><div class='prose'><ul>"
       + rows.map(e => "<li><a href='#/e/" + e.id + "'><strong>" + e.name + "</strong></a> <span class='chip'>" + CATS[e.type].n + "</span> &mdash; " + strip(e.t[e.t.length - 1]).slice(0, 130) + "</li>").join("")
       + "</ul></div>";
   });
   h += '<h2 class="sh">Races, ranked</h2><div class="prose"><p>Races don&#8217;t carry tiers, they carry rarities &mdash; but the consensus order is <strong>Enlightened</strong> and <strong>Demon</strong> first (both give total damage, which applies whatever you build), then <strong>Archon</strong> for weapon builds and <strong>Demi God</strong> for melee, then <strong>True Shinigami</strong>, then everything else.</p></div>';
   view.innerHTML = h + "</div>";
 },
 "codes": function () {
   view.innerHTML = '<div class="page full">' + head("Codes",
     "Codes drop with updates and expire without notice, and most carry a minimum level. Like the game and join the Roblox group first, then redeem via the <strong>Settings</strong> icon &rarr; text box &rarr; enter arrow.")
     + '<div class="codegrid">' + CODES.map(c => '<div class="code"><span class="c">' + c[0] + "<small>" + c[1] + '</small></span><button class="copy" type="button" data-c="' + c[0] + '">Copy</button></div>').join("") + "</div>"
     + '<div class="warnbox">Current as of the <strong>Frieren</strong> patch, early September 2026. A dead code is normal rather than a redemption mistake &mdash; the official Discord posts new ones as they ship.</div></div>';
   view.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
     navigator.clipboard.writeText(b.dataset.c).then(() => {
       b.textContent = "Copied"; b.classList.add("ok");
       setTimeout(() => { b.textContent = "Copy"; b.classList.remove("ok"); }, 1400);
     }, () => { b.textContent = "Select it"; });
   }));
 },
 "sources": function () {
   view.innerHTML = '<div class="page full">' + head("Accuracy &amp; sources",
     "Lineage Piece has no official public database. The developer posts to a Trello and a Discord; everything else is community-maintained, and the community disagrees with itself. This page says where.")
     + '<h2 class="sh">Where the sources disagree</h2><div class="tablewrap"><table><thead><tr><th>Figure</th><th>The disagreement</th></tr></thead><tbody>'
     + DISPUTED.map(d => "<tr><td><strong>" + d[0] + "</strong></td><td>" + d[1] + "</td></tr>").join("") + "</tbody></table></div>"
     + '<h2 class="sh">Check these first</h2><div class="prose"><ul>'
     + "<li>The in-game <strong>Trello</strong> and <strong>Discord</strong>, linked from the Roblox page &mdash; the only first-party sources.</li>"
     + "<li>Anything a patch can touch: recipe costs, drop rates, level gates, torch positions.</li><li>Codes, always.</li></ul>"
     + "<p style='margin-top:10px'>Compiled September 2026. Recipes and rates here are the community&#8217;s reading of the current build, not developer specs. Not affiliated with Prlz&#8217;s Den or Roblox Corporation.</p></div>"
     + '<h2 class="sh">Consulted</h2><ul class="srclist">'
     + SOURCES.map(s => '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + s[0] + "</a></li>").join("") + "</ul></div>";
 }
};

/* ── tools ── */
const attemptsFor = (p, c) => Math.ceil(Math.log(1 - c) / Math.log(1 - p));
const TOOLVIEW = {
 "odds": function () {
   view.innerHTML = '<div class="page full">' + head("Reroll &amp; drop odds",
     "Every roll and every drop in this game is an independent event, so &ldquo;I&#8217;m due&rdquo; is never true. Pick a target and see what an attempt count actually buys &mdash; and what it costs before you start.")
     + '<div class="tool"><div class="controls">'
     + '<div class="field"><label for="target">Target</label><select id="target">'
     + TARGETS.map((t, i) => '<option value="' + i + '">' + t.n + " &mdash; " + (t.p * 100) + "%</option>").join("") + "</select></div>"
     + '<div class="field"><label for="rolls">Attempts</label><input id="rolls" type="number" min="1" max="20000" value="100"></div>'
     + '<div class="field"><label for="rollslide">Drag attempts</label><input id="rollslide" type="range" min="1" max="200" value="100"></div></div>'
     + '<div class="readout">'
     + '<div class="ro"><small>Chance by then</small><b id="o-chance"></b></div>'
     + '<div class="ro"><small>Coin-toss point</small><b id="o-median"></b></div>'
     + '<div class="ro"><small>Average attempts</small><b id="o-mean"></b></div>'
     + '<div class="ro"><small>95% confident by</small><b id="o-p95"></b></div>'
     + '<div class="ro"><small>Cost for your attempts</small><b id="o-cost"></b></div></div>'
     + '<div class="chartbox"><svg id="oddschart" viewBox="0 0 720 200" role="img" aria-label="Cumulative chance of hitting the target as attempts increase"></svg></div>'
     + '<p class="note" id="o-note"></p></div></div>';
   const sel = $("#target"), rolls = $("#rolls"), slide = $("#rollslide");
   function chart(p, n) {
     const W = 720, H = 200, L = 46, R = 14, T = 14, B = 30;
     const maxX = Math.max(10, Math.min(n * 2, attemptsFor(p, 0.995)));
     const x = v => L + v / maxX * (W - L - R), y = v => T + (1 - v) * (H - T - B);
     let g = "";
     [0, .25, .5, .75, 1].forEach(v => {
       g += '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
         + '<text x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="10">' + (v * 100) + "%</text>";
     });
     let d = "";
     for (let i = 0; i <= 120; i++) { const v = maxX * i / 120; d += (i ? "L" : "M") + x(v).toFixed(1) + " " + y(1 - Math.pow(1 - p, v)).toFixed(1) + " "; }
     const cx = x(Math.min(n, maxX)), cy = y(1 - Math.pow(1 - p, Math.min(n, maxX))), med = attemptsFor(p, .5);
     const medline = med <= maxX ? '<line x1="' + x(med).toFixed(1) + '" y1="' + y(0) + '" x2="' + x(med).toFixed(1) + '" y2="' + y(1) + '" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3"/>'
       + '<text x="' + (x(med) + 5).toFixed(1) + '" y="' + (T + 11) + '" fill="var(--teal)" font-family="IBM Plex Mono, monospace" font-size="10">50% at ' + commas(med) + "</text>" : "";
     $("#oddschart").innerHTML = g + medline
       + '<path d="' + d + '" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>'
       + '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="4.5" fill="var(--gold)"/>'
       + '<text x="' + L + '" y="' + (H - 10) + '" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="10">0</text>'
       + '<text x="' + (W - R) + '" y="' + (H - 10) + '" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="10">' + commas(Math.round(maxX)) + " attempts</text>"
       + '<text x="' + (cx > W - 150 ? cx - 9 : cx + 9).toFixed(1) + '" y="' + Math.min(H - B - 6, cy + 17).toFixed(1) + '" text-anchor="' + (cx > W - 150 ? "end" : "start") + '" fill="var(--ink)" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">' + commas(n) + " &#8594; " + ((1 - Math.pow(1 - p, n)) * 100).toFixed(1) + "%</text>";
   }
   function odds() {
     const t = TARGETS[+sel.value], n = Math.max(1, Math.min(20000, +rolls.value || 1)), p = t.p;
     const ch = 1 - Math.pow(1 - p, n);
     $("#o-chance").textContent = (ch * 100).toFixed(ch > .999 ? 3 : 1) + "%";
     $("#o-median").textContent = commas(attemptsFor(p, .5));
     $("#o-mean").textContent = commas(Math.round(1 / p));
     $("#o-p95").textContent = commas(attemptsFor(p, .95));
     $("#o-cost").innerHTML = t.cost ? commas(t.cost * n) + ' <small style="font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none">' + t.cur + "</small>" : "&mdash;";
     $("#o-note").innerHTML = "<strong>" + commas(attemptsFor(p, .5)) + " " + t.unit + "</strong> is the coin-toss point &mdash; half of players hit by then, half don&#8217;t. Reaching 95% confidence takes <strong>"
       + commas(attemptsFor(p, .95)) + "</strong>" + (t.cost ? ", which is " + commas(t.cost * attemptsFor(p, .95)) + " " + t.cur : "") + ". " + t.alt;
     chart(p, n);
   }
   sel.addEventListener("change", () => { slide.max = Math.max(50, attemptsFor(TARGETS[+sel.value].p, .97)); rolls.value = Math.min(+rolls.value, +slide.max); slide.value = rolls.value; odds(); });
   rolls.addEventListener("input", () => { slide.value = Math.min(+rolls.value || 1, +slide.max); odds(); });
   slide.addEventListener("input", () => { rolls.value = slide.value; odds(); });
   slide.max = attemptsFor(0.02, .97); odds();
 },
 "planner": function () {
   const ART4 = {"Azure Edge": {ch:"weapon", v:30, extra:"+7.5% damage reduction"}, "Abyssal Striker": {ch:"melee", v:30, extra:"+15% HP"},
     "Mythical Awakening": {ch:"power", v:30, extra:"+1% lifesteal"}, "Pure Lineage": {ch:"any", v:15, extra:"all three channels"},
     "Titan Executioner": {ch:"boss", v:32.5, extra:"boss fights only"}, "Supreme Mastery": {ch:"mastery", v:47.5, extra:"mastery skills only"}};
   const races = DB.filter(e => e.type === "race");
   view.innerHTML = '<div class="page full">' + head("Build planner",
     "The one rule of Lineage Piece building: race, trait, artifact set, outfit and stat points all have to land on the same damage channel. Set a channel and this adds up only what applies to it &mdash; then names what you&#8217;d be wasting.")
     + '<div class="tool"><div class="controls">'
     + '<div class="field"><label for="chan">Damage channel</label><select id="chan"><option value="weapon">Weapon &mdash; sword skills</option><option value="melee">Strength / melee &mdash; styles &amp; M1s</option><option value="power">Power &mdash; fruit &amp; spec skills</option></select></div>'
     + '<div class="field"><label for="p-race">Race</label><select id="p-race">' + races.map((r, i) => '<option value="' + i + '">' + r.name.replace(/&middot;/g, "/") + "</option>").join("") + "</select></div>"
     + '<div class="field"><label for="p-art">Artifact set (4pc)</label><select id="p-art">' + Object.keys(ART4).map(k => '<option value="' + k + '">' + k + " (+" + ART4[k].v + "%)</option>").join("") + "</select></div>"
     + '<div class="field"><label for="p-haki">Armament Haki</label><select id="p-haki"><option value="25">Unlocked (+25%)</option><option value="0">Not yet</option></select></div></div>'
     + '<div class="stack" id="stackout"></div><div id="mismatch"></div>'
     + '<p class="note">Additive estimate. The game does not publish its damage formula and some multipliers are almost certainly multiplicative &mdash; use this to compare two setups, not to predict a number.</p></div></div>';
   $("#p-race").value = races.findIndex(r => r.id === "enlightened");
   function plan() {
     const ch = $("#chan").value, r = races[+$("#p-race").value], b = r.buff || {}, art = ART4[$("#p-art").value], haki = +$("#p-haki").value;
     const lines = [], unused = []; let sum = 0;
     const add = (s, v) => { lines.push([s, v]); sum += v; };
     if (haki) add("Armament Haki", 25);
     if (b.all) add(r.name + " &mdash; total damage", b.all);
     if (b[ch]) add(r.name + " &mdash; " + ch + " damage", b[ch]);
     else if (b.melee && ch !== "melee") unused.push(r.name + "&#8217;s +" + b.melee + "% melee damage does nothing for your " + ch + " skills.");
     if (!b.all && !b[ch] && !b.melee) unused.push(r.id === "human"
       ? "Human is the default roll with no stat bonuses &mdash; every other race is an upgrade."
       : r.name + " has no published damage figure, so this planner can&#8217;t count it. It may still be the right race for you.");
     if (art.ch === ch || art.ch === "any") add($("#p-art").value + " 4-piece", art.v);
     else if (art.ch === "boss" || art.ch === "mastery") lines.push([$("#p-art").value + " 4-piece &mdash; conditional (" + art.extra + ")", art.v, 1]);
     else unused.push($("#p-art").value + " gives +" + art.v + "% " + art.ch + " damage and you&#8217;re building " + ch + ". Swap the set or swap the channel.");
     $("#stackout").innerHTML = lines.map(l => '<div class="stackrow"' + (l[2] ? ' style="opacity:.72"' : "") + "><span>" + l[0] + '</span><span class="amt">' + (l[2] ? "" : "+") + l[1] + "%</span></div>").join("")
       + '<div class="stackrow total"><span>Stacked on your ' + ch + ' channel</span><span class="amt">+' + String(sum.toFixed(1)).replace(/\.0$/, "") + "%</span></div>";
     $("#mismatch").innerHTML = unused.length
       ? '<div class="warnbox"><strong>Wasted on this build:</strong> ' + unused.join(" ") + "</div>"
       : '<p class="note">Nothing wasted &mdash; every source above lands on the channel you&#8217;re building.</p>';
   }
   ["#chan", "#p-race", "#p-art", "#p-haki"].forEach(s => $(s).addEventListener("change", plan));
   plan();
 }
};

/* ── router ── */
function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  const p = h.split("/").filter(Boolean);
  if (!p.length) home();
  else if (p[0] === "c" && CATS[p[1]]) category(p[1]);
  else if (p[0] === "e") entry(p[1]);
  else if (p[0] === "g" && GUIDEVIEW[p[1]]) GUIDEVIEW[p[1]]();
  else if (p[0] === "t" && TOOLVIEW[p[1]]) TOOLVIEW[p[1]]();
  else notfound(p.join("/"));
  document.querySelectorAll(".side a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + h));
  window.scrollTo(0, 0);
  view.focus({preventScroll: true});
}
window.addEventListener("hashchange", route);

/* ── search ── */
const INDEX = DB.map(e => ({id: "#/e/" + e.id, n: e.name, t: CATS[e.type].n,
  hay: (strip(e.name) + " " + CATS[e.type].n + " " + strip(e.lead || "") + " " + (e.info || []).map(r => strip(r[0]) + " " + strip(r[1])).join(" ")).toLowerCase()}))
 .concat(Object.keys(CATS).map(t => ({id: "#/c/" + t, n: CATS[t].n, t: "Index", hay: strip(CATS[t].n).toLowerCase() + " index list all"})))
 .concat(Object.keys(GUIDES).map(k => ({id: "#/g/" + k, n: GUIDES[k].n, t: "Guide", hay: strip(GUIDES[k].n).toLowerCase() + " guide"})))
 .concat(Object.keys(TOOLS).map(k => ({id: "#/t/" + k, n: TOOLS[k].n, t: "Tool", hay: strip(TOOLS[k].n).toLowerCase() + " tool calculator"})));

const box = $("#search"), out = $("#results");
let hits = [], cur = -1;
box.placeholder = "Search " + DB.length + " pages — fruits, races, bosses, keys, NPCs…  (press /)";

function search() {
  const q = box.value.trim().toLowerCase();
  if (!q) { out.hidden = true; return; }
  hits = INDEX.map(r => {
    const n = strip(r.n).toLowerCase();
    let s = -1;
    if (n === q) s = 0; else if (n.startsWith(q)) s = 1; else if (n.includes(q)) s = 2; else if (r.hay.includes(q)) s = 3;
    return s < 0 ? null : {r: r, s: s};
  }).filter(Boolean).sort((a, b) => a.s - b.s || a.r.n.length - b.r.n.length).slice(0, 12).map(x => x.r);
  cur = -1;
  out.innerHTML = hits.length
    ? hits.map((r, i) => '<button type="button" data-i="' + i + '"><span class="rn">' + r.n + '</span><span class="rt">' + r.t + "</span></button>").join("")
    : '<div class="none">No page matches &ldquo;' + strip(box.value) + "&rdquo;.</div>";
  out.hidden = false;
  out.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", ev => { ev.preventDefault(); go(hits[+b.dataset.i]); }));
}
function go(r) { if (!r) return; location.hash = r.id; box.value = ""; out.hidden = true; box.blur(); }
function mark() { out.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === cur)); }

box.addEventListener("input", search);
box.addEventListener("focus", () => { if (box.value.trim()) search(); });
box.addEventListener("blur", () => setTimeout(() => { out.hidden = true; }, 120));
box.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { box.value = ""; out.hidden = true; box.blur(); }
  else if (ev.key === "ArrowDown" && hits.length) { ev.preventDefault(); cur = (cur + 1) % hits.length; mark(); }
  else if (ev.key === "ArrowUp" && hits.length) { ev.preventDefault(); cur = (cur - 1 + hits.length) % hits.length; mark(); }
  else if (ev.key === "Enter") { ev.preventDefault(); go(hits[cur < 0 ? 0 : cur]); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== box && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    ev.preventDefault(); box.focus();
  }
});

/* ── theme, random ── */
const modes = ["system", "light", "dark"], labels = {system: "Theme: auto", light: "Theme: light", dark: "Theme: dark"};
let mode = "system"; try { mode = localStorage.getItem("lineage-piece-manual.theme") || "system"; } catch (e) {}
function applyTheme() {
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  $("#themebtn").textContent = labels[mode];
  try { localStorage.setItem("lineage-piece-manual.theme", mode); } catch (e) {}
}
$("#themebtn").addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; applyTheme(); });
$("#randbtn").addEventListener("click", () => { location.hash = "#/e/" + DB[Math.floor(Math.random() * DB.length)].id; });
applyTheme();
route();
</script>
