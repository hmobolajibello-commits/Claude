<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<meta name="description" content="Turn your subjects, exam date and free hours into a day-by-day study plan. Works offline, stores everything on your own device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --card-2:#f7f9fa; --ink:#161b22; --muted:#5c6874;
  --line:#dfe4ea; --line-soft:#eaeef2; --accent:#2f6f5e; --accent-ink:#ffffff;
  --accent-soft:#e6f1ed; --warn:#8a5a12; --warn-soft:#fdf2dd; --danger:#a33a2f;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,32,.05), 0 6px 18px rgba(16,24,32,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151b; --card:#171d25; --card-2:#1d242d; --ink:#e8edf2; --muted:#9aa7b4;
    --line:#2a333e; --line-soft:#222a34; --accent:#5fbfa2; --accent-ink:#0d1418;
    --accent-soft:#1b2b28; --warn:#e0b063; --warn-soft:#2b2415; --danger:#e08a7e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px 64px}
header.top{padding:24px 0 12px}
h1{margin:0; font-size:24px; letter-spacing:-.02em}
.tagline{margin:4px 0 0; color:var(--muted); font-size:14px}

/* Tabs */
.tabs{
  position:sticky; top:0; z-index:20; display:flex; gap:6px; padding:10px 0;
  background:linear-gradient(var(--bg) 70%, transparent);
}
.tabs button{
  flex:1; min-height:44px; padding:10px 8px; font:inherit; font-weight:600; font-size:15px;
  color:var(--muted); background:var(--card); border:1px solid var(--line);
  border-radius:11px; cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tabs button .dot{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:20px; font-size:12px; background:var(--accent-soft); color:var(--accent)}
.tabs button[aria-selected="true"] .dot{background:rgba(255,255,255,.22); color:inherit}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:12px 0}
.card h2{margin:0 0 2px; font-size:18px; letter-spacing:-.01em}
.card h2 .when{color:var(--muted); font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Banner + empty states */
.banner{border-left:4px solid var(--warn); background:var(--warn-soft); color:var(--warn); padding:12px 14px; border-radius:10px; margin:12px 0; font-size:14px}
.banner button{margin-top:8px}
.empty{text-align:center; padding:28px 12px; color:var(--muted)}
.empty .big{font-size:34px; line-height:1; margin-bottom:8px}

/* Progress */
.progress{height:8px; border-radius:8px; background:var(--line-soft); overflow:hidden; margin:10px 0 2px}
.progress > i{display:block; height:100%; background:var(--accent); border-radius:8px; transition:width .25s ease}

/* Blocks */
.blocks{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.block{display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line-soft); border-radius:12px; background:var(--card-2); cursor:pointer}
.block input{flex:none; width:22px; height:22px; margin:1px 0 0; accent-color:var(--accent); cursor:pointer}
.block .body{min-width:0}
.block .line1{display:flex; flex-wrap:wrap; gap:8px; align-items:baseline}
.block .subject{font-weight:650}
.block .dur{font-size:13px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:0 8px}
.block .task{font-size:14px; color:var(--muted); margin-top:2px}
.block.done{opacity:.55}
.block.done .subject, .block.done .task{text-decoration:line-through}

/* Day rows in All days */
.day{border-top:1px solid var(--line-soft); padding:14px 0}
.day:first-of-type{border-top:0; padding-top:2px}
.day .dayhead{display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; justify-content:space-between}
.day .dayname{font-weight:650}
.day .dayname.today{color:var(--accent)}
.badge{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 9px; white-space:nowrap}
.badge.exam{color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.rest{font-size:14px; color:var(--muted); margin-top:8px}

/* Totals */
.totals{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.totals li{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; font-size:14px}
.totals .bar{grid-column:1 / -1; height:6px; border-radius:6px; background:var(--line-soft); overflow:hidden}
.totals .bar > i{display:block; height:100%; background:var(--accent); opacity:.75}

/* Form */
label.field{display:block; margin:14px 0 0; font-size:14px; font-weight:600}
label.field .hint{display:block; font-weight:400; color:var(--muted); margin-top:2px}
input[type="text"], input[type="number"], input[type="date"]{
  width:100%; margin-top:6px; padding:11px 12px; font:inherit; font-size:16px; color:var(--ink);
  background:var(--card-2); border:1px solid var(--line); border-radius:10px; min-height:44px;
}
input:focus-visible, button:focus-visible, .block:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.row{display:flex; gap:10px}
.row > *{flex:1; min-width:0}
.subject-add{display:flex; gap:8px; margin-top:6px}
.subject-add input{margin-top:0}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding:0; list-style:none}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); border-radius:20px; padding:5px 6px 5px 12px; font-size:14px; font-weight:600}
.chip button{width:24px; height:24px; padding:0; line-height:1; border:0; border-radius:50%; background:transparent; color:inherit; font-size:17px; cursor:pointer}
.chip button:hover{background:rgba(127,127,127,.18)}
.days-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(92px,1fr)); gap:8px; margin-top:8px}
.days-grid label{display:flex; align-items:center; gap:8px; padding:10px; min-height:44px; border:1px solid var(--line); border-radius:10px; background:var(--card-2); font-size:14px; cursor:pointer}
.days-grid input{width:18px; height:18px; accent-color:var(--accent)}
button{font:inherit}
.btn{min-height:46px; padding:11px 16px; font-weight:650; border-radius:11px; border:1px solid var(--line); background:var(--card-2); color:var(--ink); cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); width:100%; margin-top:18px}
.btn.link{border:0; background:none; color:var(--muted); text-decoration:underline; padding:8px 0; min-height:0}
.btn.danger{color:var(--danger)}
.btn.small{min-height:38px; padding:8px 12px; font-size:14px}
.error{margin-top:12px; color:var(--danger); font-size:14px; font-weight:600}
.actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-top:16px}
[hidden]{display:none !important}
@media (max-width:420px){ h1{font-size:21px} .card{padding:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Study Planner</h1>
    <p class="tagline" id="tagline">A day-by-day plan from today to your exam.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-today" aria-controls="view-today" aria-selected="true" data-view="today">Today <span class="dot" id="todayCount" hidden></span></button>
    <button role="tab" id="tab-all" aria-controls="view-all" aria-selected="false" data-view="all">All days</button>
    <button role="tab" id="tab-setup" aria-controls="view-setup" aria-selected="false" data-view="setup">Setup</button>
  </nav>

  <main>
    <!-- TODAY -->
    <section id="view-today" role="tabpanel" aria-labelledby="tab-today"></section>

    <!-- ALL DAYS -->
    <section id="view-all" role="tabpanel" aria-labelledby="tab-all" hidden></section>

    <!-- SETUP -->
    <section id="view-setup" role="tabpanel" aria-labelledby="tab-setup" hidden>
      <form class="card" id="setupForm" novalidate>
        <h2>Your details</h2>
        <p class="muted small">Everything stays on this device. Change anything and regenerate whenever you like.</p>

        <label class="field" for="subjectInput">Subjects
          <span class="hint">Add each subject you need to study for.</span>
        </label>
        <div class="subject-add">
          <input type="text" id="subjectInput" placeholder="e.g. Math" autocomplete="off" enterkeyhint="done" aria-label="Subject name">
          <button type="button" class="btn" id="addSubject">Add</button>
        </div>
        <ul class="chips" id="subjectChips"></ul>

        <label class="field" for="examDate">Exam date
          <span class="hint">The plan runs from today up to the day before this date.</span>
          <input type="date" id="examDate" required>
        </label>

        <div class="row">
          <label class="field" for="schoolHours">School day hours
            <span class="hint">Mon&ndash;Fri</span>
            <input type="number" id="schoolHours" min="0" max="16" step="0.5" inputmode="decimal">
          </label>
          <label class="field" for="weekendHours">Weekend hours
            <span class="hint">Sat &amp; Sun</span>
            <input type="number" id="weekendHours" min="0" max="16" step="0.5" inputmode="decimal">
          </label>
        </div>

        <div class="field" id="busyLabel">Busy days <span class="hint">Optional &mdash; tick any day you can&rsquo;t study at all.</span></div>
        <div class="days-grid" id="busyDays" role="group" aria-labelledby="busyLabel"></div>

        <p class="error" id="formError" hidden></p>
        <button type="submit" class="btn primary" id="generateBtn">Generate my plan</button>
        <div class="actions">
          <button type="button" class="btn link" id="loadSample">Load example details</button>
          <button type="button" class="btn link danger" id="clearAll">Clear all saved data</button>
        </div>
      </form>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "study-planner.v1";
  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Monday-first for the busy-day checkboxes
  var MAX_SUBJECTS = 12;

  /* ---------------------------------------------------------------- dates */
  // All dates are handled as local "YYYY-MM-DD" strings so a plan never shifts
  // across a timezone boundary.
  function toISO(d) {
    var m = String(d.getMonth() + 1), day = String(d.getDate());
    return d.getFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (day.length < 2 ? "0" + day : day);
  }
  function fromISO(iso) {
    var p = iso.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function today() { return toISO(new Date()); }
  function addDays(iso, n) {
    var d = fromISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }
  function daysBetween(a, b) {
    return Math.round((fromISO(b) - fromISO(a)) / 86400000);
  }
  function formatDate(iso) {
    return fromISO(iso).toLocaleDateString("en", { weekday: "short", day: "numeric", month: "short" });
  }
  function formatLongDate(iso) {
    return fromISO(iso).toLocaleDateString("en", { weekday: "long", day: "numeric", month: "long" });
  }
  function formatDuration(min) {
    var h = Math.floor(min / 60), m = min % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  /* ------------------------------------------------------------- storage */
  var state = { settings: null, plan: null, done: {}, view: "today", showPast: false };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && saved.settings) {
        state.settings = saved.settings;
        state.plan = saved.plan || null;
        state.done = saved.done || {};
      }
    } catch (e) { /* corrupt or unavailable storage: start fresh */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        settings: state.settings, plan: state.plan, done: state.done
      }));
    } catch (e) { /* private mode / quota: the app still works for this session */ }
  }

  /* ------------------------------------------------------- plan building */
  // Study advice moves through four phases as the exam gets closer: learn,
  // practise, test, then light revision.
  var PHASES = [
    { until: 0.35, tasks: [
      "Read through the core material for {s} and take short notes",
      "Learn the key definitions and formulas in {s}",
      "Summarise one topic of {s} in your own words",
      "Start a one-page summary sheet for {s}"
    ]},
    { until: 0.70, tasks: [
      "Work through practice questions in {s}",
      "Review your {s} notes, then test yourself with them closed",
      "Practise the {s} question types you find hardest",
      "Redo the {s} problems you got wrong and note why"
    ]},
    { until: 0.90, tasks: [
      "Do a timed practice set for {s}",
      "Cover your {s} summary sheet and rewrite it from memory",
      "Go back over past mistakes in {s} and close the gaps",
      "Mixed practice across all {s} topics"
    ]},
    { until: 1.01, tasks: [
      "Final revision: skim your {s} summary sheet and key formulas",
      "Light recall practice for {s} — no new material",
      "Read over your weakest {s} notes one last time",
      "Quick confidence check on {s}, then rest"
    ]}
  ];
  function taskFor(subject, progress, nth) {
    var phase = PHASES[PHASES.length - 1];
    for (var i = 0; i < PHASES.length; i++) {
      if (progress < PHASES[i].until) { phase = PHASES[i]; break; }
    }
    return phase.tasks[(nth - 1) % phase.tasks.length].replace("{s}", subject);
  }

  // Split a day's minutes into 1-hour-ish blocks, on a 15-minute grid, never
  // shorter than 30 minutes and never more blocks than there are subjects.
  function splitIntoBlocks(totalMinutes, subjectCount) {
    var n = Math.max(1, Math.round(totalMinutes / 60));
    n = Math.min(n, subjectCount, 4);
    while (n > 1 && totalMinutes / n < 30) n--;
    var units = Math.round(totalMinutes / 15);
    if (units < 1) return [];
    var base = Math.floor(units / n), extra = units - base * n, out = [];
    for (var i = 0; i < n; i++) out.push((base + (i < extra ? 1 : 0)) * 15);
    return out;
  }

  function generatePlan(settings) {
    var start = today();
    var lastStudyDay = addDays(settings.examDate, -1);
    var shape = [];
    for (var iso = start; daysBetween(iso, lastStudyDay) >= 0; iso = addDays(iso, 1)) {
      var dow = fromISO(iso).getDay();
      var isWeekend = dow === 0 || dow === 6;
      var busy = settings.busyDays.indexOf(dow) !== -1;
      var hours = busy ? 0 : (isWeekend ? settings.weekendHours : settings.schoolHours);
      shape.push({ date: iso, dow: dow, isWeekend: isWeekend, busy: busy, minutes: Math.round(hours * 60) });
    }

    var studyDays = 0, i;
    for (i = 0; i < shape.length; i++) if (shape[i].minutes >= 15) studyDays++;

    var cursor = 0;              // rotates subjects evenly across the whole plan
    var seen = {};               // how many sessions each subject has had so far
    var studyIndex = 0;
    var days = [];

    for (i = 0; i < shape.length; i++) {
      var day = shape[i];
      var blocks = [];
      var sizes = day.minutes >= 15 ? splitIntoBlocks(day.minutes, settings.subjects.length) : [];
      if (sizes.length) {
        var progress = studyDays > 1 ? studyIndex / (studyDays - 1) : 1;
        for (var b = 0; b < sizes.length; b++) {
          var subject = settings.subjects[cursor % settings.subjects.length];
          cursor++;
          seen[subject] = (seen[subject] || 0) + 1;
          blocks.push({
            id: day.date + "#" + b,
            subject: subject,
            minutes: sizes[b],
            task: taskFor(subject, progress, seen[subject])
          });
        }
        studyIndex++;
      }
      days.push({
        date: day.date, dow: day.dow, isWeekend: day.isWeekend,
        busy: day.busy, blocks: blocks
      });
    }

    return { createdOn: start, examDate: settings.examDate, days: days };
  }

  /* ----------------------------------------------------------- plan reads */
  function allBlocks(plan) {
    var out = [];
    plan.days.forEach(function (d) { d.blocks.forEach(function (b) { out.push(b); }); });
    return out;
  }
  function dayFor(plan, iso) {
    for (var i = 0; i < plan.days.length; i++) if (plan.days[i].date === iso) return plan.days[i];
    return null;
  }
  function isDone(id) { return !!state.done[id]; }
  function countDone(blocks) {
    var n = 0;
    blocks.forEach(function (b) { if (isDone(b.id)) n++; });
    return n;
  }
  function pruneDone(plan) {
    var live = {};
    allBlocks(plan).forEach(function (b) { if (state.done[b.id]) live[b.id] = true; });
    state.done = live;
  }

  /* ------------------------------------------------------------ rendering */
  var el = {
    tagline: document.getElementById("tagline"),
    todayCount: document.getElementById("todayCount"),
    views: {
      today: document.getElementById("view-today"),
      all: document.getElementById("view-all"),
      setup: document.getElementById("view-setup")
    },
    form: document.getElementById("setupForm"),
    subjectInput: document.getElementById("subjectInput"),
    subjectChips: document.getElementById("subjectChips"),
    examDate: document.getElementById("examDate"),
    schoolHours: document.getElementById("schoolHours"),
    weekendHours: document.getElementById("weekendHours"),
    busyDays: document.getElementById("busyDays"),
    formError: document.getElementById("formError")
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function blockHTML(b) {
    return '<li><label class="block' + (isDone(b.id) ? " done" : "") + '">' +
      '<input type="checkbox" data-block="' + esc(b.id) + '"' + (isDone(b.id) ? " checked" : "") + '>' +
      '<span class="body"><span class="line1"><span class="subject">' + esc(b.subject) + '</span>' +
      '<span class="dur">' + formatDuration(b.minutes) + '</span></span>' +
      '<span class="task">' + esc(b.task) + '</span></span></label></li>';
  }
  function progressHTML(done, total) {
    var pct = total ? Math.round((done / total) * 100) : 0;
    return '<div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100">' +
      '<i style="width:' + pct + '%"></i></div>' +
      '<p class="small muted">' + done + " of " + total + " done · " + pct + "%</p>";
  }
  function dayBadge(day) {
    if (day.busy) return '<span class="badge">Busy day</span>';
    if (!day.blocks.length) return '<span class="badge">Rest day</span>';
    return '<span class="badge">' + (day.isWeekend ? "Weekend" : "School day") + "</span>";
  }

  function renderTagline() {
    if (!state.plan) { el.tagline.textContent = "A day-by-day plan from today to your exam."; return; }
    var left = daysBetween(today(), state.plan.examDate);
    if (left < 0) el.tagline.textContent = "Exam date has passed — update your details to start a new plan.";
    else if (left === 0) el.tagline.textContent = "Exam is today. Good luck!";
    else el.tagline.textContent = plural(left, "day") + " until your exam on " + formatDate(state.plan.examDate) + ".";
  }

  function renderToday() {
    var host = el.views.today;
    if (!state.plan) {
      host.innerHTML = '<div class="card"><div class="empty"><div class="big">✎</div>' +
        "<p>No plan yet. Add your subjects, exam date and free hours to get started.</p>" +
        '<button class="btn" data-go="setup">Set up my plan</button></div></div>';
      el.todayCount.hidden = true;
      return;
    }

    var iso = today();
    var day = dayFor(state.plan, iso);
    var html = "";

    // Anything unfinished before today is worth flagging once, with a one-tap fix.
    var stale = 0;
    state.plan.days.forEach(function (d) {
      if (daysBetween(d.date, iso) > 0) stale += d.blocks.length - countDone(d.blocks);
    });
    if (stale > 0) {
      html += '<div class="banner">You have ' + plural(stale, "unfinished task") + " from earlier days. " +
        "Regenerating spreads your remaining time evenly over the days you have left." +
        '<br><button class="btn small" data-regenerate="1">Regenerate plan</button></div>';
    }

    if (daysBetween(iso, state.plan.examDate) === 0) {
      html += '<div class="card"><div class="empty"><div class="big">★</div><h2>Exam day</h2>' +
        "<p>That's what all the work was for. Good luck!</p></div></div>";
      el.todayCount.hidden = true;
    } else if (daysBetween(iso, state.plan.examDate) < 0) {
      html += '<div class="card"><div class="empty"><div class="big">✓</div><h2>This plan is finished</h2>' +
        "<p>Your exam date has passed. Set a new date to plan for the next one.</p>" +
        '<button class="btn" data-go="setup">Update details</button></div></div>';
      el.todayCount.hidden = true;
    } else if (!day) {
      html += '<div class="card"><div class="empty"><p>Today isn\'t in your saved plan.</p>' +
        '<button class="btn" data-regenerate="1">Regenerate from today</button></div></div>';
      el.todayCount.hidden = true;
    } else if (!day.blocks.length) {
      html += '<div class="card"><h2>' + formatLongDate(iso) + "</h2>" +
        '<p class="muted small">' + (day.busy ? "You marked this a busy day." : "No study hours set for this day.") + "</p>" +
        '<div class="empty"><div class="big">☁</div><p>Nothing scheduled — enjoy the break.</p></div></div>';
      el.todayCount.hidden = true;
    } else {
      var done = countDone(day.blocks);
      html += '<div class="card"><h2>Today <span class="when">· ' + formatLongDate(iso) + "</span></h2>" +
        '<p class="muted small">' + dayBadge(day) + " · " +
        formatDuration(day.blocks.reduce(function (t, b) { return t + b.minutes; }, 0)) + " of study</p>" +
        progressHTML(done, day.blocks.length) +
        '<ul class="blocks">' + day.blocks.map(blockHTML).join("") + "</ul></div>";
      el.todayCount.textContent = done + "/" + day.blocks.length;
      el.todayCount.hidden = false;
    }

    host.innerHTML = html;
  }

  function renderAll() {
    var host = el.views.all;
    if (!state.plan) {
      host.innerHTML = '<div class="card"><div class="empty"><p>No plan yet.</p>' +
        '<button class="btn" data-go="setup">Set up my plan</button></div></div>';
      return;
    }

    var iso = today();
    var past = state.plan.days.filter(function (d) { return daysBetween(d.date, iso) > 0; });
    var upcoming = state.plan.days.filter(function (d) { return daysBetween(d.date, iso) <= 0; });
    var shown = state.showPast ? past.concat(upcoming) : upcoming;

    var blocks = allBlocks(state.plan);
    var totalMinutes = blocks.reduce(function (t, b) { return t + b.minutes; }, 0);

    var html = '<div class="card"><h2>Whole plan</h2>' +
      '<p class="muted small">' + formatDate(state.plan.days.length ? state.plan.days[0].date : iso) +
      " → " + formatDate(state.plan.examDate) + " · " +
      plural(blocks.length, "block") + " · " + formatDuration(totalMinutes) + " total</p>" +
      progressHTML(countDone(blocks), blocks.length);

    // Hours per subject, so it's obvious the split is fair.
    var perSubject = {};
    blocks.forEach(function (b) { perSubject[b.subject] = (perSubject[b.subject] || 0) + b.minutes; });
    var maxMin = 0;
    Object.keys(perSubject).forEach(function (k) { if (perSubject[k] > maxMin) maxMin = perSubject[k]; });
    if (state.settings && state.settings.subjects.length) {
      html += '<ul class="totals">' + state.settings.subjects.map(function (s) {
        var m = perSubject[s] || 0;
        return "<li><span>" + esc(s) + '</span><span class="muted">' + formatDuration(m) + "</span>" +
          '<span class="bar"><i style="width:' + (maxMin ? Math.round((m / maxMin) * 100) : 0) + '%"></i></span></li>';
      }).join("") + "</ul>";
    }
    if (past.length) {
      html += '<div class="actions"><button class="btn link" data-toggle-past="1">' +
        (state.showPast ? "Hide" : "Show") + " " + plural(past.length, "earlier day") + "</button></div>";
    }
    html += "</div>";

    html += '<div class="card">';
    if (!shown.length) {
      html += '<div class="empty"><p>No study days left before the exam.</p></div>';
    } else {
      html += shown.map(function (d) {
        var isToday = d.date === iso;
        var head = '<div class="day"><div class="dayhead"><span class="dayname' + (isToday ? " today" : "") + '">' +
          formatDate(d.date) + (isToday ? " · Today" : "") + "</span>" + dayBadge(d) + "</div>";
        if (!d.blocks.length) {
          return head + '<p class="rest">' + (d.busy ? "Busy day — no study scheduled." : "No study hours for this day.") + "</p></div>";
        }
        return head + '<ul class="blocks">' + d.blocks.map(blockHTML).join("") + "</ul></div>";
      }).join("");
      html += '<div class="day"><div class="dayhead"><span class="dayname">' + formatDate(state.plan.examDate) +
        '</span><span class="badge exam">Exam day</span></div></div>';
    }
    html += "</div>";

    host.innerHTML = html;
  }

  function renderSetup() {
    var s = state.settings;
    el.subjectChips.innerHTML = (s.subjects.length ? s.subjects : []).map(function (name, i) {
      return '<li class="chip">' + esc(name) +
        '<button type="button" data-remove="' + i + '" aria-label="Remove ' + esc(name) + '">×</button></li>';
    }).join("") || '<li class="small muted">No subjects added yet.</li>';

    el.examDate.value = s.examDate || "";
    el.examDate.min = addDays(today(), 1);
    el.schoolHours.value = s.schoolHours;
    el.weekendHours.value = s.weekendHours;

    if (!el.busyDays.childNodes.length) {
      el.busyDays.innerHTML = WEEK_ORDER.map(function (d) {
        return '<label><input type="checkbox" data-busy="' + d + '">' + DAY_NAMES[d].slice(0, 3) + "</label>";
      }).join("");
    }
    Array.prototype.forEach.call(el.busyDays.querySelectorAll("input"), function (input) {
      input.checked = s.busyDays.indexOf(Number(input.getAttribute("data-busy"))) !== -1;
    });
  }

  function render() {
    renderTagline();
    if (state.view === "today") renderToday();
    else if (state.view === "all") renderAll();
    else renderSetup();

    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (btn) {
      var on = btn.getAttribute("data-view") === state.view;
      btn.setAttribute("aria-selected", on ? "true" : "false");
    });
    Object.keys(el.views).forEach(function (k) { el.views[k].hidden = k !== state.view; });
  }

  function show(view) {
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  /* -------------------------------------------------------------- events */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var go = t.closest ? t.closest("[data-view], [data-go], [data-remove], [data-regenerate], [data-toggle-past]") : null;
    if (!go) return;

    if (go.hasAttribute("data-view")) { show(go.getAttribute("data-view")); return; }
    if (go.hasAttribute("data-go")) { show(go.getAttribute("data-go")); return; }
    if (go.hasAttribute("data-toggle-past")) { state.showPast = !state.showPast; render(); return; }
    if (go.hasAttribute("data-regenerate")) {
      state.plan = generatePlan(state.settings);
      pruneDone(state.plan);
      save();
      render();
      return;
    }
    if (go.hasAttribute("data-remove")) {
      state.settings.subjects.splice(Number(go.getAttribute("data-remove")), 1);
      save();
      renderSetup();
    }
  });

  document.addEventListener("change", function (e) {
    var box = e.target;
    if (box.matches && box.matches("[data-block]")) {
      var id = box.getAttribute("data-block");
      if (box.checked) state.done[id] = true; else delete state.done[id];
      save();
      // Update in place so the list doesn't jump under the user's finger,
      // then refresh the surrounding counters.
      var label = box.closest("label");
      if (label) label.classList.toggle("done", box.checked);
      if (state.view === "today") renderToday(); else renderAll();
      return;
    }
    if (box.matches && box.matches("[data-busy]")) {
      var d = Number(box.getAttribute("data-busy"));
      var at = state.settings.busyDays.indexOf(d);
      if (box.checked && at === -1) state.settings.busyDays.push(d);
      if (!box.checked && at !== -1) state.settings.busyDays.splice(at, 1);
      save();
    }
  });

  function addSubjects(raw) {
    var added = 0;
    raw.split(",").forEach(function (part) {
      var name = part.trim().replace(/\s+/g, " ");
      if (!name) return;
      if (state.settings.subjects.length >= MAX_SUBJECTS) return;
      var exists = state.settings.subjects.some(function (s) { return s.toLowerCase() === name.toLowerCase(); });
      if (exists) return;
      state.settings.subjects.push(name.slice(0, 40));
      added++;
    });
    if (added) { save(); renderSetup(); }
    el.subjectInput.value = "";
    el.subjectInput.focus();
  }
  document.getElementById("addSubject").addEventListener("click", function () {
    addSubjects(el.subjectInput.value);
  });
  el.subjectInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addSubjects(el.subjectInput.value); }
  });

  function readNumber(input, fallback) {
    var v = parseFloat(input.value);
    if (isNaN(v) || v < 0) return fallback;
    return Math.min(16, Math.round(v * 2) / 2);
  }

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();

    // A subject typed but not added is almost certainly meant to be included.
    if (el.subjectInput.value.trim()) addSubjects(el.subjectInput.value);

    var s = state.settings;
    s.examDate = el.examDate.value;
    s.schoolHours = readNumber(el.schoolHours, 0);
    s.weekendHours = readNumber(el.weekendHours, 0);
    el.schoolHours.value = s.schoolHours;
    el.weekendHours.value = s.weekendHours;

    var error = "";
    if (!s.subjects.length) error = "Add at least one subject.";
    else if (!s.examDate) error = "Pick your exam date.";
    else if (daysBetween(today(), s.examDate) < 1) error = "Pick an exam date at least one day from today.";
    else if (s.schoolHours <= 0 && s.weekendHours <= 0) error = "Set study hours for school days, weekends, or both.";

    if (!error) {
      var plan = generatePlan(s);
      if (!allBlocks(plan).length) {
        error = "That leaves no time to study. Free up a busy day or add some hours.";
      } else {
        state.plan = plan;
        pruneDone(plan);
        save();
        el.formError.hidden = true;
        show("today");
        return;
      }
    }
    el.formError.textContent = error;
    el.formError.hidden = false;
  });

  document.getElementById("loadSample").addEventListener("click", function () {
    state.settings = {
      subjects: ["Math", "Physics", "English"],
      examDate: addDays(today(), 21),
      schoolHours: 2,
      weekendHours: 4,
      busyDays: []
    };
    save();
    renderSetup();
  });

  document.getElementById("clearAll").addEventListener("click", function () {
    if (!window.confirm("Delete your saved subjects, plan and progress from this device?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    state.settings = defaults();
    state.plan = null;
    state.done = {};
    show("setup");
  });

  function defaults() {
    return { subjects: [], examDate: addDays(today(), 21), schoolHours: 2, weekendHours: 4, busyDays: [] };
  }

  /* ---------------------------------------------------------------- init */
  load();
  if (!state.settings) state.settings = defaults();
  if (!Array.isArray(state.settings.subjects)) state.settings.subjects = [];
  if (!Array.isArray(state.settings.busyDays)) state.settings.busyDays = [];
  state.view = state.plan ? "today" : "setup";
  render();

  // Coming back to the tab on a new day should show that day, not a stale one.
  var renderedOn = today();
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && today() !== renderedOn) { renderedOn = today(); render(); }
  });
})();
</script>
</body>
</html>
