<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root{
  --ground:#e8eef2; --surface:#f8fbfc; --sunk:#dee7ec; --raise:#ffffff; --stripe:#f1f6f8;
  --ink:#08171f; --ink2:#2f454f; --muted:#647b86; --line:#c1cfd6; --line2:#d7e1e6;
  --gold:#a05f08; --gold-soft:#f6e7cc; --teal:#0a5f80; --teal-soft:#d9eaf1;
  --violet:#5c3a9e; --good:#12734f; --warn:#8d5c0c; --bad:#9d2f28;
  --r-trash:#7b8a90; --r-common:#5d7079; --r-uncommon:#22794c; --r-unusual:#17708a;
  --r-rare:#1c5fb0; --r-exotic:#7132a8; --r-legendary:#a05f08; --r-mythical:#ac1f5f;
  --r-secret:#2b2b3a; --r-limited:#0d7b86;
  --sans:"Chivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Big Shoulders Display","Big Shoulders","Oswald","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#06121a; --surface:#0c1e28; --sunk:#091924; --raise:#112733; --stripe:#0e2230;
  --ink:#e7f2f6; --ink2:#b2c8d1; --muted:#7b96a2; --line:#1f3a49; --line2:#172d39;
  --gold:#e6b14b; --gold-soft:#33280a; --teal:#4cc2e0; --teal-soft:#0a2c38;
  --violet:#b79bff; --good:#4bd096; --warn:#e9b352; --bad:#ff7d6d;
  --r-trash:#8fa1a9; --r-common:#9fb2bb; --r-uncommon:#57cf8d; --r-unusual:#54c8e2;
  --r-rare:#5fa6f5; --r-exotic:#c08bff; --r-legendary:#e6b14b; --r-mythical:#ff62a5;
  --r-secret:#cbd3e6; --r-limited:#3ddad0;
}}
:root[data-theme="dark"]{
  --ground:#06121a; --surface:#0c1e28; --sunk:#091924; --raise:#112733; --stripe:#0e2230;
  --ink:#e7f2f6; --ink2:#b2c8d1; --muted:#7b96a2; --line:#1f3a49; --line2:#172d39;
  --gold:#e6b14b; --gold-soft:#33280a; --teal:#4cc2e0; --teal-soft:#0a2c38;
  --violet:#b79bff; --good:#4bd096; --warn:#e9b352; --bad:#ff7d6d;
  --r-trash:#8fa1a9; --r-common:#9fb2bb; --r-uncommon:#57cf8d; --r-unusual:#54c8e2;
  --r-rare:#5fa6f5; --r-exotic:#c08bff; --r-legendary:#e6b14b; --r-mythical:#ff62a5;
  --r-secret:#cbd3e6; --r-limited:#3ddad0;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
table{border-collapse:collapse;width:100%}

/* top bar */
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:9px clamp(12px,2vw,22px)}
.mark{display:flex;flex-direction:column;gap:0;flex:0 0 auto}
.mark b{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1;color:var(--ink)}
.mark span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mark:hover{text-decoration:none}
.searchwrap{position:relative;flex:1 1 300px;max-width:520px}
#search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:8px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
#search::placeholder{color:var(--muted)}
.results{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);max-height:56vh;overflow-y:auto;z-index:80}
.results button{display:flex;width:100%;gap:9px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:8px 11px;font-size:13px}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.sel{background:var(--sunk)}
.results .rn{flex:1;color:var(--ink)}
.results .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.results .none{padding:12px;color:var(--muted);font-size:13px}
.topright{display:flex;gap:8px;align-items:center;margin-left:auto;flex:0 0 auto}
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);border-radius:5px;padding:5px 9px;font-size:12px;color:var(--ink2);white-space:nowrap}
.ghost:hover{border-color:var(--ink2);color:var(--ink)}

/* frame */
.frame{display:grid;grid-template-columns:222px minmax(0,1fr);max-width:1500px;margin:0 auto}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 0 50px;position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto}
.sgroup{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:14px 18px 5px}
.side a{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:5px 18px;color:var(--ink2);font-size:13px;border-left:2px solid transparent}
.side a:hover{background:var(--sunk);color:var(--ink);text-decoration:none}
.side a.on{background:var(--sunk);color:var(--ink);border-left-color:var(--gold);font-weight:500}
.side a em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--muted)}
.view{padding:20px clamp(14px,2.6vw,40px) 90px;min-width:0}

/* article + infobox */
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.page.full{grid-template-columns:minmax(0,1fr)}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;gap:7px;flex-wrap:wrap}
.crumb a{color:var(--muted)}
h1.pt{font-size:clamp(30px,4.2vw,44px);letter-spacing:-.015em;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.t{border-color:currentColor;font-weight:600}
.lead{margin-top:16px;font-size:15.5px;color:var(--ink2);max-width:66ch}
.lead strong{color:var(--ink)}
h2.sh{font-size:21px;margin:26px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.prose{color:var(--ink2);max-width:70ch}
.prose p+p{margin-top:9px}
.prose ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.prose li::marker{color:var(--gold)}
.prose strong{color:var(--ink)}
.prose ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.prose table{margin-top:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden}

.infobox{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:sticky;top:62px}
.ibhead{background:var(--teal-soft);border-bottom:1px solid var(--line);padding:9px 13px}
.ibhead b{font-family:var(--disp);font-size:17px;font-weight:800;display:block;line-height:1.1;color:var(--ink)}
.ibhead span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.ibrow{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 13px;border-bottom:1px solid var(--line2);font-size:12.5px}
.ibrow:last-child{border-bottom:0}
.ibrow dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.ibrow dd{margin:0;color:var(--ink2)}
.ibrow dd b{color:var(--ink)}
.seealso{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seealso a{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--ink2);background:var(--surface)}
.seealso a:hover{border-color:var(--gold);color:var(--gold);text-decoration:none}
.pagefoot{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* index tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:14px}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:400;background:var(--surface);position:relative;user-select:none}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--ink)}
thead th.asc::after{content:" \2191";color:var(--gold)}
thead th.desc::after{content:" \2193";color:var(--gold)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2);font-size:13px}
tbody tr:nth-child(even) td{background:var(--stripe)}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
tbody a{color:var(--ink);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.rar{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.rar-trash{color:var(--r-trash)} .rar-common{color:var(--r-common)} .rar-uncommon{color:var(--r-uncommon)}
.rar-unusual{color:var(--r-unusual)} .rar-rare{color:var(--r-rare)} .rar-exotic{color:var(--r-exotic)}
.rar-legendary{color:var(--r-legendary)} .rar-mythical{color:var(--r-mythical)}
.rar-secret{color:var(--r-secret)} .rar-limited{color:var(--r-limited)}
.tier{font-family:var(--disp);font-weight:800;font-size:14px;min-width:23px;height:23px;padding:0 5px;display:inline-grid;place-items:center;border-radius:4px;color:#fff}
.t-S{background:var(--r-mythical)} .t-A{background:var(--r-legendary)} .t-B{background:var(--teal)} .t-C{background:var(--r-common)} .t-D{background:var(--r-trash)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.flag{border-bottom:1px dotted var(--warn);color:var(--warn);cursor:help}
.stage{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* home */
.hero{border-bottom:2px solid var(--ink);padding-bottom:20px}
.hero h1{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{margin-top:11px;max-width:64ch;color:var(--ink2);font-size:15.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.tile:hover{border-color:var(--teal);text-decoration:none}
.tile b{font-family:var(--disp);font-size:18px;font-weight:800;color:var(--ink)}
.tile span{font-size:12.5px;color:var(--ink2)}
.tile em{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--teal)}
.tile.hi{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px;margin-top:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.cat:hover{background:var(--sunk);border-color:var(--teal);text-decoration:none}
.cat b{font-family:var(--disp);font-size:17px;font-weight:700;color:var(--ink)}
.cat span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.warnbox{border-left:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:11px 14px;border-radius:0 4px 4px 0;font-size:13px;color:var(--ink2);margin-top:16px}
.goodbox{border-left:2px solid var(--good);background:color-mix(in srgb,var(--good) 9%,transparent);padding:11px 14px;border-radius:0 4px 4px 0;font-size:13px;color:var(--ink2);margin-top:16px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:11px;margin-top:12px}

/* guides + tools */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.phasehead{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--sunk)}
.phasehead h3{font-size:17px;flex:1}
.phasehead .lv{font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.tasks{list-style:none;margin:0;padding:5px 7px}
.task{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--ink2)}
.task:hover{background:var(--sunk)}
.task input{margin:4px 0 0;accent-color:var(--teal);width:14px;height:14px;flex:0 0 auto}
.task.done{color:var(--muted);text-decoration:line-through}
.progline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;margin-top:14px}
.progtrack{flex:1 1 180px;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.progfill{height:100%;background:var(--teal);width:0;transition:width .25s}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:14px;margin-top:14px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
select,input[type=number],input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--teal)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.ro{background:var(--raise);padding:10px 12px}
.ro b{display:block;font-family:var(--disp);font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.ro small{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.chartbox{border:1px solid var(--line2);border-radius:5px;background:var(--raise);padding:11px 7px 3px}
.stackrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;background:var(--raise);border:1px solid var(--line2);border-radius:4px}
.stackrow .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.stackrow.total{background:var(--teal-soft);border-color:var(--teal)}
.stackrow.total span{color:var(--ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:6px}
.codegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:10px;margin-top:14px}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
.code .c{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink);word-break:break-all}
.code small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:400}
.copy{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.copy:hover{border-color:var(--gold);color:var(--gold)}
.copy.ok{border-color:var(--good);color:var(--good)}
.srclist{columns:2 230px;column-gap:24px;font-size:12.5px;color:var(--ink2);padding-left:18px}
.srclist li{margin-bottom:4px;break-inside:avoid}

/* the path planner */
.stepcard{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.stepcard .n{font-family:var(--disp);font-size:20px;font-weight:800;color:var(--ground);background:var(--teal);border-radius:5px;width:30px;height:30px;display:grid;place-items:center}
.stepcard h4{font-size:17px;color:var(--ink)}
.stepcard p{font-size:13px;color:var(--ink2);margin-top:3px}
.stepcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.stepcard .meta span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.stepcard.block .n{background:var(--warn)}
.stepcard.done{opacity:.55}
.stepcard.done .n{background:var(--good)}
.steps{display:flex;flex-direction:column;gap:8px}
.youare{background:var(--teal-soft);border:1px solid var(--teal);border-radius:6px;padding:14px 16px}
.youare b{font-family:var(--disp);font-size:24px;display:block;line-height:1.1;color:var(--ink)}
.youare span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.youare p{margin-top:7px;font-size:13.5px;color:var(--ink2)}
.gapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.gap{background:var(--raise);border:1px solid var(--line2);border-radius:5px;padding:9px 11px}
.gap b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink)}
.gap small{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 12px}
.checkgrid label{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink2);cursor:pointer}
.checkgrid input{accent-color:var(--teal);width:14px;height:14px}

@media (max-width:1080px){.page{grid-template-columns:minmax(0,1fr)}.infobox{position:static;order:-1}}
@media (max-width:860px){
  .frame{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 0}
  .side a{display:inline-flex;border:1px solid var(--line);border-radius:99px;margin:2px;padding:4px 11px;border-left-width:1px}
  .side a.on{border-color:var(--gold)}
  .side a em{display:none}
  .sgroup{padding:9px 14px 3px}
  .top{flex-wrap:wrap}.stamp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const RODS = [
["flimsy-rod","Flimsy Rod",0,0,"Free &mdash; you start with it","Given at spawn","D","The rod you are handed",

["training-rod","Training Rod",0,null,"<span class=\"flag\" title=\"Listed in shop rundowns; price varies between write-ups\">Shop &mdash; a few hundred C$</span>","Moosewood shop","D","Skip it",
 "A marginal step above the Flimsy Rod, sold early enough that new players buy it before they know better. Every progression guide in circulation says the same thing: skip the Training Rod.",

["carbon-rod","Carbon Rod",1,2000,"<b>2,000 C$</b>","Marc&#8217;s shop, Moosewood","C","The first purchase worth making",

["fast-rod","Fast Rod",1,4500,"<b>4,500 C$</b>","Marc&#8217;s shop, Moosewood","C","Casts per hour, not rarity",
 "A lure-speed rod. Fish bite sooner, so you get more casts per hour &mdash; which is worth real money when you are farming common fish for C$ and worth much less when you are hunting one rare species.",
 "<p>Lure speed multiplies your <em>throughput</em>; luck multiplies your <em>odds per cast</em>. Early on, throughput usually wins, because you are selling volume. Once you are chasing bestiary entries, the <a href=\"#/e/lucky-rod\">Lucky Rod</a> profile matters more.</p><p>Optional. If money is tight, skip both and save for the Steady Rod.</p>",["lucky-rod","steady-rod","money"]],
["lucky-rod","Lucky Rod",1,5250,"<b>5,250 C$</b>","Marc&#8217;s shop, Moosewood","C","Rarity bias, early",
 "The early luck rod. Where the Fast Rod gives you more casts, the Lucky Rod makes each cast likelier to produce something rare &mdash; which is what fills a bestiary and what sells for more than pocket change.",
 "<p>Universal luck biases the whole rarity table upward. It does not guarantee anything: at these rates a dry stretch is normal and means nothing about the next cast.</p><p>Optional in the same way the Fast Rod is optional. The <a href=\"#/e/steady-rod\">Steady Rod</a> at 7,000 C$ is the rod both of them are a detour from.</p>",["steady-rod","fast-rod","luck","bestiary"]],
["steady-rod","Steady Rod",1,7000,"<span class=\"flag\" title=\"Community figure; shop prices move between patches\"><b>7,000 C$</b></span>","Blacksmith, Roslit Bay","B","The rod that ends the early game",
 "The first rod that feels like equipment rather than a starter item. It widens the shake UI and carries enough control and resilience to land almost anything the early and early-mid islands throw at you.",
 "<p>Its signature effect is a <strong>larger shake window</strong>, which is a direct difficulty reduction on the part of Fisch that costs new players the most fish. Combined with high resilience, it turns the minigame from a skill check into a formality on ordinary catches.</p><p>Buy it, sail to <a href=\"#/e/mushgrove-swamp\">Mushgrove Swamp</a>, and get the Fungal Rod for free.</p>",["fungal-rod","roslit-bay","minigame","path"]],
["fungal-rod","Fungal Rod",2,0,"<b>Free</b>","Agaric, Mushgrove Swamp &mdash; catch an Alligator","B","The best value in the game",
 "A free rod with a real passive, handed over for catching one Alligator in the swamp. There is no other point in Fisch where the reward-to-effort ratio is this lopsided, which is why every rod-progression guide routes through Agaric.",
 "<p><strong>Passive:</strong> roughly a <span class=\"flag\" title=\"60% is the figure the progression guides quote\">60% chance after each catch</span> to grant a strong luck boost for about <strong>45 seconds</strong>. Chained across a session it is close to permanent uptime.</p><p>That passive outperforms the shop rods available at the same stage, and it costs nothing. Get it before you spend six figures on anything.</p>",["agaric","mushgrove-swamp","luck","arctic-rod","path"]],
["midas-rod","Midas Rod",3,null,"<span class=\"flag\" title=\"Widely described but shop location and price differ between write-ups\">Price and vendor vary by source</span>","Shop &mdash; verify in game","B","A money rod, not a rarity rod",

["kings-rod","King&#8217;s Rod",4,120000,"<span class=\"flag\" title=\"120,000 C$ at the Enchant Altar in one guide; other write-ups place it differently\"><b>120,000 C$</b></span>","<span class=\"flag\" title=\"Sold near the Enchant Altar per one source\">Enchant Altar area</span>","B","A mid-late shop rod",
 "A solid mid-late purchase that sits between the Trident Rod and the rods below it. Sources agree it exists and is good; they do not fully agree on where it is sold or what it costs, so treat the figures here as a starting point.",

["arctic-rod","Arctic Rod",4,null,"<span class=\"flag\" title=\"Shop price not consistently published\">Shop price varies</span>","Northern Summit","B","The cold-biome step",

["trident-rod","Trident Rod",4,150000,"<b>150,000 C$</b>","Trident&#8217;s Temple","A","The most flexible mid-game rod",

["destiny-rod","Destiny Rod",5,190000,"<b>190,000 C$</b>","Caleia, The Arch &mdash; needs <b>70% bestiary</b>","A","The collection payoff",
 "Cheap for its tier, and locked behind work rather than money: Caleia will not sell it until your total bestiary completion reaches <strong>70%</strong>. It is the reward for having filled the easy locations properly on the way through.",
 "<p>The 70% gate is total completion across locations, so the efficient route is finishing <em>whole easy blocks</em> &mdash; Moosewood, Roslit Bay, Terrapin, the Ocean &mdash; rather than chasing one hard species everywhere.</p><p>At 190,000 C$ it undercuts rods well below it in power. If you are near 70%, finish the bestiary before you buy anything else.</p>",["caleia","the-arch","bestiary","terrapin-island"]],
["rod-of-the-depths","Rod of the Depths",5,750000,"<b>750,000 C$</b>","Inside The Depths","A","The late-game workhorse",

["kraken-rod","Kraken Rod",6,950000,"<span class=\"flag\" title=\"950,000 C$ in one guide, 1,333,333 C$ in another\"><b>950,000</b> or <b>1,333,333 C$</b></span>","Atlantis &mdash; <span class=\"flag\" title=\"Reported alongside the Atlantis task chain\">~level 180</span>","A","The endgame bridge",

["chrysalis-rod","Chrysalis Rod",7,null,"<span class=\"flag\" title=\"No consistently published shop price\">Not a plain shop purchase</span>","Underground Music Venue","S","End of the standard ladder",

["elder-moss-ripper","Elder Moss Ripper Rod",8,null,"<span class=\"flag\" title=\"Obtained at Castaway Cliffs; acquisition details vary between write-ups\">Castaway Cliffs &mdash; verify in game</span>","Castaway Cliffs","S","The money meta, single-handedly",

function farmFor(stage) {
  if (stage <= 1) return ["the Moosewood dock and Roslit Bay", "#/e/roslit-bay", "a few thousand C$/hr"];

let sortState = {};
function category(type) {
  const cat = CATS[type], rows = DB.filter(e => e.type === type);
  const facets = {}; rows.forEach(e => { const k = e.tier || e.rar; if (k) facets[k] = 1; });
  const keys = Object.keys(facets);
  const st = sortState[type] || {i: -1, dir: 1};
  view.innerHTML = '<div class="page full"><div class="crumb"><a href="#/">Main page</a> &rsaquo; <span>' + cat.n + "</span></div>"
    + '<h1 class="pt">' + cat.n + '</h1><div class="chips"><span class="chip">' + rows.length + " pages</span>"
    + '<span class="chip">Click a column to sort</span></div>'
    + (CATNOTE[type] ? '<div class="note" style="margin-top:14px">' + CATNOTE[type] + "</div>" : "")
    + (keys.length ? '<div class="filters"><button class="fbtn on" data-f="">All</button>' + keys.map(k => '<button class="fbtn" data-f="' + k + '">' + k + "</button>").join("") + "</div>" : "")
    + '<div class="tablewrap"><table><thead><tr>' + cat.cols.map((c, i) => '<th class="s' + (st.i === i ? (st.dir > 0 ? " asc" : " desc") : "") + '" data-i="' + i + '">' + c + "</th>").join("") + '</tr></thead><tbody id="rows"></tbody></table></div>'
    + '<p class="note">Every row links to its own page. Search from the bar above to jump straight to one.</p></div>';

  let filter = "";
  function draw() {
    let list = rows.filter(e => !filter || e.tier === filter || e.rar === filter);
    if (st.i >= 0) {
      list = list.slice().sort((a, b) => {
        const av = st.i === 0 ? a.name : a.t[st.i - 1], bv = st.i === 0 ? b.name : b.t[st.i - 1];
        const an = parseFloat(strip(av).replace(/,/g, "")), bn = parseFloat(strip(bv).replace(/,/g, ""));
        const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : strip(av).localeCompare(strip(bv));
        return cmp * st.dir;
      });
    }
    $("#rows").innerHTML = list.map(e => "<tr><td><a href='#/e/" + e.id + "'>" + e.name + "</a></td>"
      + e.t.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("")
      || '<tr><td colspan="' + cat.cols.length + '" style="padding:20px;text-align:center;color:var(--muted)">Nothing matches that filter.</td></tr>';
  }
  draw();
  view.querySelectorAll("th.s").forEach(th => th.addEventListener("click", () => {
    const i = +th.dataset.i;
    st.dir = (st.i === i) ? -st.dir : 1; st.i = i; sortState[type] = st;
    view.querySelectorAll("th.s").forEach(x => x.classList.remove("asc", "desc"));
    th.classList.add(st.dir > 0 ? "asc" : "desc");
    draw();
  }));
  view.querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => {
    view.querySelectorAll(".fbtn").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; draw();
  }));
}

/* ── entry page ── */
function entry(id) {
  const e = BY[id];
  if (!e) return notfound(id);
  const cat = CATS[e.type], sibs = DB.filter(x => x.type === e.type), i = sibs.indexOf(e);
  const chips = ['<span class="chip">' + cat.n + "</span>"]
    .concat(e.rar ? ['<span class="chip t rar-' + e.rar + '">' + e.rar + "</span>"] : [])
    .concat(e.tier ? ['<span class="chip t" style="color:var(--r-' + (e.tier === "S" ? "mythical" : e.tier === "A" ? "legendary" : e.tier === "B" ? "rare" : "common") + ')">Tier ' + e.tier + "</span>"] : [])
    .concat(e.stage !== undefined ? ['<span class="chip">Stage ' + e.stage + " &middot; " + STAGES[e.stage] + "</span>"] : []);
  const see = (e.see || []).map(link).filter(Boolean)
    .filter(l => l[0] !== "#/e/" + id)
    .filter((l, idx, arr) => arr.findIndex(x => x[0] === l[0]) === idx)
    .map(l => '<a href="' + l[0] + '">' + l[1] + "</a>").join("");
  view.innerHTML = '<div class="page"><article><div class="crumb"><a href="#/">Main page</a> &rsaquo; <a href="#/c/' + e.type + '">' + cat.n + "</a> &rsaquo; <span>" + e.name + "</span></div>"
    + '<h1 class="pt">' + e.name + '</h1><div class="chips">' + chips.join("") + "</div>"
    + '<p class="lead">' + e.lead + "</p>"
    + (e.sec || []).map(s => '<h2 class="sh">' + s[0] + '</h2><div class="prose">' + s[1] + "</div>").join("")
    + (see ? '<h2 class="sh">See also</h2><div class="seealso">' + see + "</div>" : "")
    + '<div class="pagefoot"><span>Data: September 2026</span><span>'
    + (i > 0 ? '<a href="#/e/' + sibs[i - 1].id + '">&larr; ' + sibs[i - 1].name + "</a>" : "")
    + (i > 0 && i < sibs.length - 1 ? " &nbsp;&middot;&nbsp; " : "")
    + (i < sibs.length - 1 ? '<a href="#/e/' + sibs[i + 1].id + '">' + sibs[i + 1].name + " &rarr;</a>" : "") + "</span></div></article>"
    + '<aside class="infobox"><div class="ibhead"><span>' + cat.n + "</span><b>" + e.name + "</b></div>"
    + (e.info || []).map(r => '<dl class="ibrow"><dt>' + r[0] + "</dt><dd>" + r[1] + "</dd></dl>").join("")
    + "</aside></div>";
}

function notfound(id) {
  view.innerHTML = '<div class="page full"><h1 class="pt">No such page</h1><p class="lead">Nothing in the database is filed under &ldquo;' + strip(id) + '&rdquo;. Try the search bar, or <a href="#/">start from the main page</a>.</p></div>';

 "xp-guide": function () {
   view.innerHTML = '<div class="page full">' + ghead("XP &amp; levelling",
     "Each level costs <b>190 &times; your current level</b>, so the curve is arithmetic rather than exponential for the first thousand levels &mdash; and still adds up to about 997 million XP for the 2,000 cap. Levelling in Fisch is a stacking problem, not a grinding problem.")

     + '<div class="field"><label for="x-from">Current level</label><input id="x-from" type="number" min="1" max="2000" value="50"></div>'

     + '<div class="readout" id="x-out"></div>'
     + '<p class="note">XP to go from level L to L+1 is 190 &times; L, so the total between two levels is 190 &times; the sum of the levels in between. Past level 1001 the cost is reported to double every 500 levels &mdash; this calculator does not model that, so treat targets above 1000 as a floor.</p></div>'
     + '<div class="prose"><h2 class="sh">The stack</h2>'
     + "<p>XP bonuses come from unrelated systems and multiply together, which is why a properly stacked catch can be worth tens of thousands of XP and an unstacked one a few hundred.</p>"
     + "<ul><li>An XP-flavoured rod and its mutations</li><li><a href=\"#/e/merlin\">Merlin&#8217;s</a> temporary XP boost &mdash; <b>+20%</b></li>"
     + "<li><a href=\"#/e/shell-of-wrath\">Shell of Wrath</a> &mdash; <b>+25%</b></li><li>A <a href=\"#/e/companions\">companion</a> with an XP passive</li>"
     + "<li>Location and night multipliers &mdash; up to <b>3&times;</b> in specific spots</li><li>The <strong>Double XP</strong> gamepass</li>"
     + "<li><strong>+10% per friend</strong> in your party, up to <b>+50%</b></li></ul>"
     + "<p>The friend bonus is the one people leave on the table: five friends is +50% XP for nothing.</p>"
     + '<h2 class="sh">Why you would bother</h2><p>Levels gate content. The clearest example is <a href=\"#/e/atlantis\">Atlantis</a> at around level 180 &mdash; no amount of C$ substitutes. If the <a href=\"#/t/path\">planner</a> tells you your level is the blocker, this page is the fix.</p></div></div>';

   const xpBetween = (a, b) => { if (b <= a) return 0; a = Math.max(1, a); return 190 * ((b - 1) * b / 2 - (a - 1) * a / 2); };
   function calc() {
     const a = Math.max(1, +$("#x-from").value || 1), b = Math.max(a + 1, +$("#x-to").value || a + 1);

     $("#x-out").innerHTML =

      + '<div class="ro"><b>' + commas(need) + '</b><small>XP from ' + a + " to " + b + "</small></div>"
      + '<div class="ro"><b>' + commas(effective) + '</b><small>XP per catch, stacked</small></div>'
      + '<div class="ro"><b>' + commas(catches) + '</b><small>catches needed</small></div>'
      + '<div class="ro"><b>' + commas(need / per) + '</b><small>catches with no stack at all</small></div>';
   }
   ["#x-from", "#x-to", "#x-per", "#x-mult"].forEach(s => $(s).addEventListener("input", calc));
   calc();
 },

try { const raw = localStorage.getItem(SKEY); if (raw) PSTATE = Object.assign(PSTATE, JSON.parse(raw), {f: Object.assign({}, DEFSTATE.f, (JSON.parse(raw) || {}).f)}); } catch (e) {}

const GOALS = {

  money:  ["Make money",          "Money is location-first. The fastest raise available to you is almost always moving to a better farm, not buying a better rod &mdash; and the rod you are saving for gets cheaper in hours once you do."],
  level:  ["Level up",            "Levels come from stacking multipliers, not from fishing longer. Before another session, get the friend bonus (+10% each, up to +50%), an XP potion and a shell on. See <a href=\"#/g/xp-guide\">XP &amp; levelling</a>."],
  dex:    ["Fill the bestiary",   "Percentage is percentage: finish whole easy locations before chasing hard species. And a stuck bestiary is usually a <em>condition</em> problem &mdash; buy the <a href=\"#/e/totems\">totem</a> for the weather the fish wants rather than waiting for it."],

const HOURLY = s => (s <= 1 ? 5000 : s <= 3 ? 250000 : s <= 5 ? 400000 : s <= 7 ? 1500000 : 3000000);
const xpBetweenLv = (a, b) => (b <= a ? 0 : 190 * ((b - 1) * b / 2 - (Math.max(1, a) - 1) * Math.max(1, a) / 2));

const TOOLVIEW = {
 "path": function () {
   view.innerHTML = '<div class="page full">' + ghead("Where am I? &mdash; path planner",
     "Tell it your level, your best rod, your bank balance and what you have already unlocked. It walks the same milestone list the <a href=\"#/g/progression\">roadmap</a> uses, works out where you actually are, and gives you the next five things to do &mdash; in order, with what each one costs and where to earn it. Your answers save in this browser.")

     + '<div><label style="font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Already done</label>'

     + '<div id="p-out"></div></div>';

   function read() {
     PSTATE.lvl = Math.max(1, +$("#p-lvl").value || 1);
     PSTATE.rod = $("#p-rod").value;
     PSTATE.cash = Math.max(0, +$("#p-cash").value || 0);
     PSTATE.goal = $("#p-goal").value;
     view.querySelectorAll(".checkgrid input").forEach(c => { PSTATE.f[c.dataset.f] = c.checked; });
     saveState();
     const ord = ordOf(PSTATE.rod);
     /* some flags are proved by the rod you are carrying: you cannot own a Steady Rod
        without having sailed, or a Rod of the Depths without having cleared Vertigo.
        Infer those rather than making a returning player re-tick them. */
     const f = Object.assign({}, PSTATE.f);
     if (ord >= ordOf("steady-rod")) f.boat = true;
     if (ord >= ordOf("destiny-rod")) f.best70 = true;
     if (ord >= ordOf("rod-of-the-depths")) { f.vertigo = true; f.depths = true; }
     return {lvl: PSTATE.lvl, ord: ord, cash: PSTATE.cash, f: f};
   }

   function plan() {
     const s = read();
     const rod = RODS[s.ord];
     const stage = rod[2];
     const doneList = MILESTONES.filter(m => m.done(s));
     const todo = MILESTONES.filter(m => !m.done(s));
     const next = todo.slice(0, 5);
     /* where you are is the furthest phase you have reached — anything unfinished
        behind it is catch-up work, and the step list surfaces it first anyway */
     const phIdx = doneList.length ? Math.max.apply(null, doneList.map(m => m.ph)) : (next.length ? next[0].ph : 0);
     const phase = PHASES[phIdx];
     const farm = farmFor(stage);
     const rate = HOURLY(stage);

     /* the "you are here" summary */
     let where = '<div class="youare"><span>You are here</span><b>' + phase.n + "</b><p>"
       + "Level <strong>" + commas(s.lvl) + "</strong>, carrying the <a href=\"#/e/" + rod[0] + "\">" + rod[1] + "</a> (stage " + stage + " &mdash; " + STAGES[stage] + "), "
       + "with <strong>" + cash(s.cash) + "</strong> banked. "
       + doneList.length + " of " + MILESTONES.length + " milestones behind you."
       + (next.length ? " Next up: <strong>" + strip(next[0].t) + "</strong>." : " You have cleared the whole route &mdash; from here it is mutations, enchants and money.")
       + "</p>"
       + '<div class="gapgrid">'
       + '<div class="gap"><b>' + commas(190 * s.lvl) + '</b><small>XP to your next level</small></div>'
       + '<div class="gap"><b>' + (s.lvl >= 180 ? "cleared" : commas(180 - s.lvl)) + '</b><small>levels to the Atlantis gate</small></div>'
       + '<div class="gap"><b>' + cash(rate) + '</b><small>roughly earnable per hour now</small></div>'
       + '<div class="gap"><b>' + doneList.length + " / " + MILESTONES.length + '</b><small>route milestones done</small></div>'
       + "</div></div>";

     /* the steps */
     let steps = "";
     next.forEach((m, i) => {
       const shortCash = m.cost ? Math.max(0, m.cost - s.cash) : 0;
       const shortLvl = m.lvl ? Math.max(0, m.lvl - s.lvl) : 0;
       const blocked = shortCash > 0 || shortLvl > 0;
       let extra = "";
       if (shortCash > 0) {
         extra += "<p><strong>You are " + cash(shortCash) + " short.</strong> At your stage that is roughly <strong>"
           + (shortCash / rate < 1 ? "under an hour" : (shortCash / rate).toFixed(1) + " hours") + "</strong> at <a href=\"" + farm[1] + "\">" + farm[0] + "</a> (" + farm[2] + ").</p>";
       }
       if (shortLvl > 0) {
         extra += "<p><strong>You are " + shortLvl + " levels short</strong> &mdash; " + commas(xpBetweenLv(s.lvl, m.lvl))
           + " XP. Stack your XP bonuses before grinding it (see <a href=\"#/g/xp-guide\">XP &amp; levelling</a>).</p>";
       }
       steps += '<div class="stepcard' + (blocked ? " block" : "") + '"><div class="n">' + (i + 1) + "</div><div>"
         + "<h4>" + m.t + "</h4><p>" + m.body + "</p>" + extra
         + '<div class="meta">' + (m.ph < phIdx ? '<span style="color:var(--violet);border-color:var(--violet)">Skipped &mdash; catch-up</span>' : "")
         + (m.cost ? "<span>" + cash(m.cost) + "</span>" : "<span>No cost</span>")
         + (m.lvl ? "<span>Level " + m.lvl + "</span>" : "")
         + "<span>" + m.where + "</span>"
         + (blocked ? "<span style=\"color:var(--warn);border-color:var(--warn)\">Blocked</span>" : "<span style=\"color:var(--good);border-color:var(--good)\">Do it now</span>")
         + "</div></div></div>";
     });

     /* warnings that are not milestones */
     const warn = [];
     if (s.lvl >= 60 && stage <= 1) warn.push("You are level " + s.lvl + " on a stage-" + stage + " rod. The rod is your bottleneck, not your level &mdash; the free <a href=\"#/e/fungal-rod\">Fungal Rod</a> from Agaric costs nothing and would fix most of it today.");
     if (s.cash >= 200000 && stage <= 3) warn.push("You are sitting on " + cash(s.cash) + " with a stage-" + stage + " rod. Money that is not spent is not doing anything &mdash; the <a href=\"#/e/trident-rod\">Trident Rod</a> at 150,000 C$ starts paying itself back the moment you buy it.");
     if (!s.f.altar && s.lvl > 30) warn.push("The <a href=\"#/e/keepers-altar\">Keepers Altar</a> is still closed. It is a one-time <strong>400 C$</strong> bribe and it gates every enchant in the game.");
     if (!s.f.boat && s.lvl > 10) warn.push("Still no boat. The <a href=\"#/e/rowboat\">Rowboat</a> is 400 C$ and it is the difference between one island and the whole map.");
     if (s.f.vertigo && !s.f.depths) warn.push("Vertigo is done but you have no key &mdash; go fish the <strong>Strange Whirlpool</strong>. That is the only thing standing between you and a 750,000 C$ rod shop.");
     if (stage >= 6 && !s.f.enchanted) warn.push("An endgame rod with no enchant is leaving a quarter of its value on the table. Go farm relics at <a href=\"#/e/ancient-isle\">Ancient Isle</a>.");

     const goal = GOALS[PSTATE.goal];
     $("#p-out").innerHTML = where
       + '<h2 class="sh">Do these next</h2>'
       + (steps ? '<div class="steps">' + steps + "</div>" : '<div class="goodbox">Nothing left on the route. Pick a farm from <a href="#/g/money-guide">Making money</a> and start chasing mutations and exalted enchants instead.</div>')
       + '<div class="goodbox"><strong>Because you picked &ldquo;' + goal[0] + '&rdquo;:</strong> ' + goal[1] + "</div>"
       + (warn.length ? '<h2 class="sh">Worth fixing</h2>' + warn.map(w => '<div class="warnbox">' + w + "</div>").join("") : "")
       + (doneList.length ? '<h2 class="sh">Already behind you</h2><div class="tablewrap"><table><tbody>'
           + doneList.map(m => "<tr><td style=\"width:1%;white-space:nowrap;color:var(--good)\">&#10003;</td><td><strong>" + m.t + "</strong></td><td>" + m.where + "</td></tr>").join("")
           + "</tbody></table></div>" : "")
       + '<p class="note">The planner reads what you tell it, so tell it the truth &mdash; especially the checkboxes. Costs are the community figures from this wiki and hourly rates are rough; use them to sequence decisions, not to budget an evening precisely.</p>';
   }
   ["#p-lvl", "#p-rod", "#p-cash", "#p-goal"].forEach(sel => { $(sel).addEventListener("input", plan); $(sel).addEventListener("change", plan); });
   view.querySelectorAll(".checkgrid input").forEach(c => c.addEventListener("change", plan));
   $("#p-reset").addEventListener("click", () => { PSTATE = JSON.parse(JSON.stringify(DEFSTATE)); saveState(); TOOLVIEW.path(); });
   plan();
 },

 "odds": function () {
   const TARGETS = [
     {n:"Trident Rod &mdash; Atlantean proc", p:0.30, note:"A published rod passive, so this rate is about as solid as Fisch rates get."},
     {n:"Quantum enchant &mdash; Subspace mutation", p:0.25, note:"25% per catch, per the exalted enchant&#8217;s description."},
     {n:"Midas Rod &mdash; Golden catch", p:0.60, note:"Roughly 60% for double value."},
     {n:"Fungal Rod &mdash; luck window", p:0.60, note:"Roughly 60% after each catch, for about 45 seconds."},
     {n:"A 5% drop", p:0.05, note:"Use this shape for anything a guide calls &ldquo;uncommon&rdquo;."},
     {n:"A 1% drop", p:0.01, note:"The shape most relic and key grinds feel like."},
     {n:"A 0.1% drop", p:0.001, note:"Secret-tier territory. Bring a podcast."}
   ];
   view.innerHTML = '<div class="page full">' + ghead("Drop &amp; catch odds",
     "Fisch does not publish most of its drop rates, so this tool does not pretend to know them. Pick one of the rates that <em>is</em> published &mdash; the rod and enchant passives &mdash; or type in the rate you believe, and it will tell you what a given number of attempts actually buys.")
     + '<div class="tool"><div class="controls">'
     + '<div class="field"><label for="o-t">Rate</label><select id="o-t">' + TARGETS.map((t, i) => '<option value="' + i + '">' + t.n + " &mdash; " + (t.p * 100) + "%</option>").join("") + '<option value="-1">Custom&hellip;</option></select></div>'
     + '<div class="field"><label for="o-p">Rate, %</label><input id="o-p" type="number" min="0.001" max="100" step="0.001" value="30"></div>'
     + '<div class="field"><label for="o-n">Attempts</label><input id="o-n" type="number" min="1" value="20"></div></div>'
     + '<input id="o-slide" type="range" min="1" max="200" value="20">'
     + '<div class="readout" id="o-out"></div><div class="chartbox"><svg id="o-chart" viewBox="0 0 620 150" width="100%" height="150" role="img" aria-label="Cumulative probability curve"></svg></div>'
     + '<p class="note" id="o-note"></p>'
     + '<div class="warnbox"><strong>The gambler&#8217;s fallacy, stated plainly:</strong> every cast is independent. Forty dry attempts at 1% does not make the forty-first likelier. What the numbers below tell you is how much patience a grind needs on average &mdash; not what you are owed.</div></div></div>';
   const attemptsFor = (p, conf) => Math.ceil(Math.log(1 - conf) / Math.log(1 - p));
   function chart(p, n) {
     const w = 620, h = 150, pad = 26, max = Math.max(n, attemptsFor(p, 0.97));
     let d = "";
     for (let i = 0; i <= 100; i++) {
       const x = pad + (w - pad - 8) * i / 100, y = h - 18 - (h - 34) * (1 - Math.pow(1 - p, max * i / 100));
       d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
     }
     let g = "";
     [0, .25, .5, .75, 1].forEach(v => {
       const y = h - 18 - (h - 34) * v;
       g += '<line x1="' + pad + '" y1="' + y + '" x2="' + (w - 8) + '" y2="' + y + '" stroke="var(--line2)"/>'
         + '<text x="2" y="' + (y + 3) + '" font-size="9" fill="var(--muted)" font-family="monospace">' + (v * 100) + "%</text>";
     });
     const cx = pad + (w - pad - 8) * Math.min(1, n / max);
     const cy = h - 18 - (h - 34) * (1 - Math.pow(1 - p, n));
     $("#o-chart").innerHTML = g + '<path d="' + d + '" fill="none" stroke="var(--teal)" stroke-width="2"/>'
       + '<line x1="' + cx + '" y1="16" x2="' + cx + '" y2="' + (h - 18) + '" stroke="var(--gold)" stroke-dasharray="3 3"/>'
       + '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="var(--gold)"/>'
       + '<text x="' + (w - 8) + '" y="' + (h - 5) + '" font-size="9" fill="var(--muted)" text-anchor="end" font-family="monospace">' + max + " attempts</text>";
   }
   function odds() {
     const p = Math.min(0.999, Math.max(0.00001, (+$("#o-p").value || 1) / 100)), n = Math.max(1, +$("#o-n").value || 1);
     const cum = 1 - Math.pow(1 - p, n);
     $("#o-out").innerHTML =
        '<div class="ro"><b>' + (cum * 100).toFixed(1) + '%</b><small>chance in ' + commas(n) + " attempts</small></div>"
      + '<div class="ro"><b>' + commas(attemptsFor(p, 0.5)) + '</b><small>coin-toss point</small></div>'
      + '<div class="ro"><b>' + commas(attemptsFor(p, 0.95)) + '</b><small>for 95% confidence</small></div>'
      + '<div class="ro"><b>' + commas(1 / p) + '</b><small>attempts per success, on average</small></div>';
     chart(p, n);
   }
   $("#o-t").addEventListener("change", () => {
     const i = +$("#o-t").value;
     if (i >= 0) { $("#o-p").value = TARGETS[i].p * 100; $("#o-note").innerHTML = TARGETS[i].note; }
     else $("#o-note").innerHTML = "Custom rate &mdash; whatever you believe the drop is. If a guide gives you a number, remember it is a community estimate too.";
     odds();
   });
   ["#o-p", "#o-n"].forEach(s => $(s).addEventListener("input", () => { $("#o-slide").value = Math.min(200, +$("#o-n").value || 1); odds(); }));
   $("#o-slide").addEventListener("input", () => { $("#o-n").value = $("#o-slide").value; odds(); });
   $("#o-note").innerHTML = TARGETS[0].note;
   odds();
 },

 "value": function () {
   const withMult = MUTS.filter(m => m[2]);
   view.innerHTML = '<div class="page full">' + ghead("Fish value calculator",
     "A fish sells for its species&#8217; base value scaled by weight and then multiplied by whatever mutation and attributes it carries. This models that structure so you can see what a mutation is actually worth before you decide whether to <a href=\"#/e/appraisal\">appraise</a> it.")
     + '<div class="tool"><div class="controls">'
     + '<div class="field"><label for="v-base">Plain sale value, C$</label><input id="v-base" type="number" min="1" value="8000"></div>'
     + '<div class="field"><label for="v-mut">Mutation</label><select id="v-mut"><option value="1">None</option>'
       + withMult.map(m => '<option value="' + m[2] + '">' + m[1] + " &mdash; " + m[2] + "&times;</option>").join("") + "</select></div>"
     + '<div class="field"><label for="v-weight">Weight vs. average</label><select id="v-weight">'
       + [[0.7,"Small (0.7&times;)"],[1,"Average (1&times;)"],[1.4,"Big (1.4&times;)"],[2,"Huge (2&times;)"]].map(o => '<option value="' + o[0] + '"' + (o[0] === 1 ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select></div>"
     + '<div class="field"><label for="v-overlord">Sea Overlord enchant</label><select id="v-overlord"><option value="1">No</option><option value="1.25">Yes &mdash; +25% weight</option></select></div></div>'
     + '<div class="checkgrid"><label><input type="checkbox" id="v-shiny"> Shiny (1.85&times;, appraisal-safe)</label>'
     + '<label><input type="checkbox" id="v-spark"> Sparkling (1.85&times;, appraisal-safe)</label></div>'
     + '<div class="readout" id="v-out"></div><div class="stack" id="v-stack"></div>'
     + '<p class="note">A model of the multiplier structure, not the game&#8217;s exact arithmetic &mdash; Fisch does not publish its value formula, and weight scaling in particular is an approximation here. Use it to compare two catches, not to predict a sale.</p></div></div>';
   function calc() {
     const base = Math.max(1, +$("#v-base").value || 1), mut = +$("#v-mut").value, wt = +$("#v-weight").value, ov = +$("#v-overlord").value;
     const sh = $("#v-shiny").checked ? 1.85 : 1, sp = $("#v-spark").checked ? 1.85 : 1;
     const total = base * wt * ov * mut * sh * sp;
     const rows = [["Plain sale value", cash(base)], ["Weight", "&times;" + wt]];
     if (ov > 1) rows.push(["Sea Overlord", "&times;" + ov]);
     if (mut > 1) rows.push([$("#v-mut").selectedOptions[0].text.split(" &mdash;")[0].split(" —")[0], "&times;" + mut]);
     if (sh > 1) rows.push(["Shiny", "&times;1.85"]);
     if (sp > 1) rows.push(["Sparkling", "&times;1.85"]);
     $("#v-out").innerHTML = '<div class="ro"><b>' + cash(total) + '</b><small>estimated sale</small></div>'
       + '<div class="ro"><b>&times;' + (total / base).toFixed(2) + '</b><small>total multiplier</small></div>'
       + '<div class="ro"><b>' + cash(total - base) + '</b><small>added by the stack</small></div>';
     $("#v-stack").innerHTML = rows.map(r => '<div class="stackrow"><span>' + r[0] + '</span><span class="amt">' + r[1] + "</span></div>").join("")
       + '<div class="stackrow total"><span>Estimated sale</span><span class="amt">' + cash(total) + "</span></div>";
   }
   ["#v-base", "#v-mut", "#v-weight", "#v-overlord", "#v-shiny", "#v-spark"].forEach(s => { $(s).addEventListener("input", calc); $(s).addEventListener("change", calc); });
   calc();
 }
};

/* ── router ── */
function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  const p = h.split("/").filter(Boolean);
  if (!p.length) home();
  else if (p[0] === "c" && CATS[p[1]]) category(p[1]);
  else if (p[0] === "e") entry(p[1]);
  else if (p[0] === "g" && GUIDEVIEW[p[1]]) GUIDEVIEW[p[1]]();
  else if (p[0] === "t" && TOOLVIEW[p[1]]) TOOLVIEW[p[1]]();
  else notfound(p.join("/"));
  document.querySelectorAll(".side a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + h));
  window.scrollTo(0, 0);
  view.focus({preventScroll: true});
}
window.addEventListener("hashchange", route);

/* ── search ── */
const INDEX = DB.map(e => ({id: "#/e/" + e.id, n: e.name, t: CATS[e.type].n,
  hay: (strip(e.name) + " " + CATS[e.type].n + " " + strip(e.lead || "") + " " + (e.info || []).map(r => strip(r[0]) + " " + strip(r[1])).join(" ")).toLowerCase()}))
 .concat(Object.keys(CATS).map(t => ({id: "#/c/" + t, n: CATS[t].n, t: "Index", hay: strip(CATS[t].n).toLowerCase() + " index list all"})))
 .concat(Object.keys(GUIDES).map(k => ({id: "#/g/" + k, n: GUIDES[k].n, t: "Guide", hay: strip(GUIDES[k].n).toLowerCase() + " guide walkthrough"})))
 .concat(Object.keys(TOOLS).map(k => ({id: "#/t/" + k, n: TOOLS[k].n, t: "Tool", hay: strip(TOOLS[k].n).toLowerCase() + " tool calculator planner"})));

const box = $("#search"), out = $("#results");
let hits = [], cur = -1;
box.placeholder = "Search " + DB.length + " pages — rods, baits, fish, locations, enchants…  (press /)";

function search() {
  const q = box.value.trim().toLowerCase();
  if (!q) { out.hidden = true; return; }
  hits = INDEX.map(r => {
    const n = strip(r.n).toLowerCase();
    let s = -1;
    if (n === q) s = 0; else if (n.startsWith(q)) s = 1; else if (n.includes(q)) s = 2; else if (r.hay.includes(q)) s = 3;
    return s < 0 ? null : {r: r, s: s};
  }).filter(Boolean).sort((a, b) => a.s - b.s || a.r.n.length - b.r.n.length).slice(0, 12).map(x => x.r);
  cur = -1;
  out.innerHTML = hits.length
    ? hits.map((r, i) => '<button type="button" data-i="' + i + '"><span class="rn">' + r.n + '</span><span class="rt">' + r.t + "</span></button>").join("")
    : '<div class="none">No page matches &ldquo;' + strip(box.value) + "&rdquo;.</div>";
  out.hidden = false;
  out.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", ev => { ev.preventDefault(); go(hits[+b.dataset.i]); }));
}
function go(r) { if (!r) return; location.hash = r.id; box.value = ""; out.hidden = true; box.blur(); }
function mark() { out.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === cur)); }

box.addEventListener("input", search);
box.addEventListener("focus", () => { if (box.value.trim()) search(); });
box.addEventListener("blur", () => setTimeout(() => { out.hidden = true; }, 120));
box.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { box.value = ""; out.hidden = true; box.blur(); }
  else if (ev.key === "ArrowDown" && hits.length) { ev.preventDefault(); cur = (cur + 1) % hits.length; mark(); }
  else if (ev.key === "ArrowUp" && hits.length) { ev.preventDefault(); cur = (cur - 1 + hits.length) % hits.length; mark(); }
  else if (ev.key === "Enter") { ev.preventDefault(); go(hits[cur < 0 ? 0 : cur]); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== box && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    ev.preventDefault(); box.focus();
  }
});

/* ── theme, random ── */
const modes = ["system", "light", "dark"], labels = {system: "Theme: auto", light: "Theme: light", dark: "Theme: dark"};
let mode = "system"; try { mode = localStorage.getItem("fisch-field-guide.theme") || "system"; } catch (e) {}
function applyTheme() {
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  $("#themebtn").textContent = labels[mode];
  try { localStorage.setItem("fisch-field-guide.theme", mode); } catch (e) {}
}
$("#themebtn").addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; applyTheme(); });
$("#randbtn").addEventListener("click", () => { location.hash = "#/e/" + DB[Math.floor(Math.random() * DB.length)].id; });
applyTheme();
route();
</script>
