name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/roblox-lineage-piece-guide-c4v2nd
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild index.html from src/guide.html
        run: ./build.sh

      - name: Check the committed index.html is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html does not match src/guide.html. Run ./build.sh and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html favicon.svg og.png robots.txt sitemap.xml _site/
          cp .nojekyll _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
