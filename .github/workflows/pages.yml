name: Deploy site to GitHub Pages

# Manual only. The site is hosted elsewhere (see README); this workflow is kept as
# a second option. It cannot run until Pages is switched on for the repo:
# Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
# Without that, actions/configure-pages fails with
# "Create Pages site failed: Resource not accessible by integration".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: ./build.sh

      - name: Check the committed index.html is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::notice::index.html differs from the committed copy (expected: the canonical URL is host-specific)."
            git diff --stat -- index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
