# Netlify: connect this repo and these settings are picked up automatically.
# The build needs nothing but a shell — no Python, Node or package install — so
# there is deliberately no language version pinned here. SITE_URL is derived from
# Netlify's own $URL, so the canonical link and social-card URLs match the domain
# the site actually ends up on, custom domains included.
[build]
  command = "bash build.sh"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
