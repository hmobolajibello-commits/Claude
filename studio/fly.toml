# Fly.io. From the studio/ folder:
#
#   fly launch --no-deploy --name my-voice-studio
#   fly volume create studio_data --size 1
#   fly secrets set STUDIO_PASSWORD='something long' \
#                   STUDIO_SECRET="$(openssl rand -hex 32)" \
#                   STUDIO_API_KEY='your model api key'
#   fly deploy
#
# Unlike a free-tier Render service, the volume below means settings and
# account connections survive restarts.

app = "voice-studio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  STUDIO_DATA_DIR = "/data/.studio"
  STUDIO_WORKSPACE = "/data/workspace"

[[mounts]]
  source = "studio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
